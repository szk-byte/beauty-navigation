<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅先検索ノート</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2328;
      --muted: #64707d;
      --line: #dce3e8;
      --paper: #fbfaf7;
      --panel: #ffffff;
      --accent: #0b6f6a;
      --accent-2: #bc4b51;
      --accent-3: #d89b25;
      --green-soft: #e4f1ec;
      --rose-soft: #f8e8e9;
      --gold-soft: #fbf0d5;
      --shadow: 0 18px 48px rgba(25, 34, 45, .11);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(228, 241, 236, .82), rgba(251, 250, 247, 0) 360px),
        var(--paper);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 34px 0 24px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--accent);
    }

    h1 {
      max-width: 820px;
      margin: 12px 0 12px;
      font-size: clamp(34px, 6vw, 72px);
      line-height: .96;
      letter-spacing: 0;
    }

    .lead {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 0;
      background: rgba(251, 250, 247, .86);
      border-top: 1px solid rgba(220, 227, 232, .7);
      border-bottom: 1px solid rgba(220, 227, 232, .9);
      backdrop-filter: blur(16px);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .searchbox {
      position: relative;
    }

    .searchbox svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 20px;
      height: 20px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    input[type="search"] {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 16px 0 44px;
      color: var(--ink);
      background: var(--panel);
      outline: none;
      box-shadow: 0 8px 28px rgba(30, 38, 47, .05);
    }

    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(11, 111, 106, .12);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .filter {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 14px;
      color: var(--ink);
      background: var(--panel);
      cursor: pointer;
      transition: .18s ease;
    }

    .filter:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .filter.active {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 24px 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      padding-bottom: 54px;
    }

    .card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(28, 39, 49, .07);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover,
    .card:focus-visible {
      border-color: rgba(11, 111, 106, .55);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
      outline: none;
    }

    .photos {
      display: grid;
      grid-template-columns: 1.18fr .82fr;
      grid-template-rows: repeat(2, 130px);
      gap: 3px;
      background: var(--line);
    }

    .photos img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #d7dedf;
    }

    .photos img:first-child {
      grid-row: 1 / 3;
    }

    .photos.one {
      grid-template-columns: 1fr;
      grid-template-rows: 260px;
    }

    .photos.one img:first-child {
      grid-row: auto;
    }

    .photos.two {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 260px;
    }

    .photos.two img:first-child {
      grid-row: auto;
    }

    .body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .place {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .type {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .type.food {
      color: #853034;
      background: var(--rose-soft);
    }

    .type.stay {
      color: #075f5b;
      background: var(--green-soft);
    }

    .type.sight {
      color: #775000;
      background: var(--gold-soft);
    }

    .type.activity {
      color: #2d557a;
      background: #e3eff8;
    }

    .hook {
      margin: 0;
      color: var(--accent-2);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.6;
    }

    .desc {
      margin: 0;
      color: #3f4852;
      font-size: 14px;
      line-height: 1.8;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }

    .tag {
      border: 1px solid #e4e9ed;
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--muted);
      font-size: 12px;
      background: #fff;
    }

    .open-detail {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(11, 111, 106, .22);
      border-radius: var(--radius);
      color: var(--accent);
      background: #f3fbf8;
      font-weight: 800;
      cursor: pointer;
    }

    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      background: rgba(18, 26, 32, .5);
    }

    .detail-overlay.open {
      display: flex;
    }

    .detail-sheet {
      width: min(840px, 100%);
      max-height: min(88vh, 860px);
      overflow: auto;
      border-radius: 14px 14px 8px 8px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }

    .detail-hero {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      gap: 0;
      border-bottom: 1px solid var(--line);
    }

    .detail-photo {
      min-height: 250px;
      background-position: center;
      background-size: cover;
    }

    .detail-head {
      padding: 22px;
    }

    .detail-head h3 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.25;
    }

    .detail-head .place {
      margin: 0 0 14px;
    }

    .detail-close {
      position: sticky;
      top: 10px;
      float: right;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, .92);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .detail-content {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      padding: 18px 22px 22px;
    }

    .detail-block {
      min-width: 0;
    }

    .detail-block h4 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 14px;
    }

    .detail-block p,
    .detail-block ul {
      margin: 0;
      color: #3f4852;
      font-size: 14px;
      line-height: 1.8;
    }

    .detail-block ul {
      padding-left: 1.1em;
    }

    .detail-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 22px 24px;
    }

    .detail-links a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      border-radius: var(--radius);
      padding: 0 13px;
      color: #fff;
      background: var(--accent);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    .detail-links a.secondary {
      color: var(--accent);
      background: #eef8f5;
    }

    .empty {
      display: none;
      padding: 54px 0 72px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 20px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 40px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100% - 22px, 1180px);
      }

      header {
        padding-top: 24px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .filters {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 2px;
      }

      .filter {
        flex: 0 0 auto;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .photos {
        grid-template-rows: repeat(2, 112px);
      }

      .photos.one,
      .photos.two {
        grid-template-rows: 224px;
      }

      .detail-overlay {
        padding: 0;
      }

      .detail-sheet {
        width: 100%;
        max-height: 92vh;
        border-radius: 16px 16px 0 0;
      }

      .detail-hero {
        grid-template-columns: 1fr;
      }

      .detail-photo {
        min-height: 220px;
      }

      .detail-content {
        grid-template-columns: 1fr;
      }

      .meta-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="shell">
    <div class="eyebrow">Trip Finder</div>
    <h1>行きたい気分から選ぶ、わくわく旅先リスト</h1>
    <p class="lead">食事、宿泊、観光、アクティビティを横断して探せる候補集です。名前・地域・「夜景」「温泉」「ご褒美」などの気分ワードで絞り込めます。</p>
  </header>

  <section class="toolbar" aria-label="検索と絞り込み">
    <div class="shell controls">
      <label class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="例：京都、温泉、夜景、鮨、グランピング">
      </label>
      <div class="filters" role="list" aria-label="種別">
        <button class="filter active" data-filter="all" type="button">すべて</button>
        <button class="filter" data-filter="food" type="button">食事</button>
        <button class="filter" data-filter="stay" type="button">ホテル・宿泊</button>
        <button class="filter" data-filter="sight" type="button">観光施設</button>
        <button class="filter" data-filter="activity" type="button">アクティビティ</button>
      </div>
    </div>
  </section>

  <main class="shell">
    <div class="meta-row">
      <div id="resultCount">読み込み中...</div>
      <div>写真は旅先の雰囲気が伝わる代表イメージです。</div>
    </div>
    <section id="cards" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty">
      <strong>条件に合う旅先が見つかりませんでした</strong>
      検索ワードを短くするか、カテゴリを「すべて」に戻してみてください。
    </div>
  </main>

  <footer class="shell">
    掲載内容は旅先選びのための概要です。営業時間、休館日、予約可否、災害・改修などの最新情報は訪問前に公式情報で確認してください。
  </footer>

  <div id="detailOverlay" class="detail-overlay" aria-hidden="true">
    <section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button id="detailClose" class="detail-close" type="button" aria-label="詳細を閉じる">×</button>
      <div class="detail-hero">
        <div id="detailPhoto" class="detail-photo" aria-hidden="true"></div>
        <div class="detail-head">
          <span id="detailType" class="type food">食事</span>
          <h3 id="detailTitle"></h3>
          <p id="detailArea" class="place"></p>
          <p id="detailHook" class="hook"></p>
          <p id="detailDesc" class="desc"></p>
        </div>
      </div>
      <div class="detail-content">
        <div class="detail-block">
          <h4>見どころ</h4>
          <p id="detailHighlights"></p>
        </div>
        <div class="detail-block">
          <h4>楽しみ方</h4>
          <p id="detailPlan"></p>
        </div>
        <div class="detail-block">
          <h4>予約前メモ</h4>
          <p id="detailMemo"></p>
        </div>
      </div>
      <div id="detailLinks" class="detail-links"></div>
    </section>
  </div>

  <script>

      food: "食事",
      stay: "ホテル・宿泊",
      sight: "観光施設",

    const imageUrl = (query, lock) => {
      const cleaned = query.toLowerCase().replace(/[^a-z0-9]+/g, ",").replace(/^,|,$/g, "");
      return `https://source.unsplash.com/900x650/?${cleaned}&sig=${lock}`;
    };

    const cards = document.querySelector("#cards");
    const search = document.querySelector("#search");
    const resultCount = document.querySelector("#resultCount");
    const empty = document.querySelector("#empty");
    let currentFilter = "all";

    const normalize = (text) => text.toLowerCase().replace(/\s+/g, "");

    function render() {
      const term = normalize(search.value.trim());
      const filtered = trips.filter((trip) => {
        const inCategory = currentFilter === "all" || trip.category === currentFilter;
        const haystack = normalize([trip.name, trip.area, trip.hook, trip.desc, ...trip.tags].join(" "));
        return inCategory && (!term || haystack.includes(term));
      });

      cards.innerHTML = filtered.map((trip, index) => {
        const words = [trip.name, trip.area, ...trip.tags].join(" ");
        const photoMarkup = trip.photos.map((photo, photoIndex) => {
          const lock = 2200 + index * 10 + photoIndex;
          return `<img src="${imageUrl(photo, lock)}" alt="${trip.name}の代表イメージ ${photoIndex + 1}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${encodeURIComponent(trip.name + photoIndex)}/900/650'">`;
        }).join("");

        return `
          <article class="card" data-trip="${trip.name}" data-words="${words}" role="button" tabindex="0" aria-label="${trip.name}の詳細を開く">
            <div class="photos ${trip.photos.length === 1 ? "one" : trip.photos.length === 2 ? "two" : "three"}">${photoMarkup}</div>
            <div class="body">
              <div class="topline">
                <div>
                  <h2>${trip.name}</h2>
                  <div class="place">${trip.area}</div>
                </div>
                <span class="type ${trip.category}">${categoryLabels[trip.category]}</span>
              </div>
              <p class="hook">${trip.hook}</p>
              <p class="desc">${trip.desc}</p>
              <div class="tags">${trip.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}</div>
              <button class="open-detail" type="button">詳しく見る</button>
            </div>
          </article>
        `;
      }).join("");

      resultCount.textContent = `${filtered.length}件表示中 / 全${trips.length}件`;
      empty.style.display = filtered.length ? "none" : "block";
    }

    document.querySelectorAll(".filter").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        currentFilter = button.dataset.filter;
        render();
      });
    });

    const detailOverlay = document.querySelector("#detailOverlay");
    const detailClose = document.querySelector("#detailClose");
    const detailPhoto = document.querySelector("#detailPhoto");
    const detailType = document.querySelector("#detailType");
    const detailTitle = document.querySelector("#detailTitle");
    const detailArea = document.querySelector("#detailArea");
    const detailHook = document.querySelector("#detailHook");
    const detailDesc = document.querySelector("#detailDesc");
    const detailHighlights = document.querySelector("#detailHighlights");
    const detailPlan = document.querySelector("#detailPlan");
    const detailMemo = document.querySelector("#detailMemo");
    const detailLinks = document.querySelector("#detailLinks");

    function openDetail(name) {
      const trip = trips.find((item) => item.name === name);
      if (!trip) return;

      const detail = tripDetails[trip.name] || {};
      const firstPhoto = trip.photos[0] || trip.name;
      detailPhoto.style.backgroundImage = `url("${imageUrl(firstPhoto, 8800 + trips.indexOf(trip))}")`;
      detailType.className = `type ${trip.category}`;
      detailType.textContent = categoryLabels[trip.category];
      detailTitle.textContent = trip.name;
      detailArea.textContent = trip.area;
      detailHook.textContent = trip.hook;
      detailDesc.textContent = trip.desc;
      detailHighlights.textContent = detail.highlights || "旅先の雰囲気、周辺の過ごし方、季節感を合わせて楽しみたい候補です。";
      detailPlan.textContent = detail.plan || "前後の観光や食事と合わせて、半日から一泊の旅程に組み込むと楽しみやすいです。";
      detailMemo.textContent = detail.memo || "営業時間、予約可否、アクセス、休業日を訪問前に確認してください。";
      detailLinks.innerHTML = (detail.links || []).map((link, index) => {
        const klass = index === 0 ? "" : "secondary";
        return `<a class="${klass}" href="${link.url}" target="_blank" rel="noopener noreferrer">${link.label}</a>`;
      }).join("") || '<a class="secondary" href="https://www.google.com/search?q=%E6%97%85%E5%85%88+%E4%BA%88%E7%B4%84" target="_blank" rel="noopener noreferrer">関連検索</a>';

      detailOverlay.classList.add("open");
      detailOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      detailClose.focus();
    }

    function closeDetail() {
      detailOverlay.classList.remove("open");
      detailOverlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    cards.addEventListener("click", (event) => {
      const card = event.target.closest(".card");
      if (!card) return;
      openDetail(card.dataset.trip);
    });

    cards.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const card = event.target.closest(".card");
      if (!card) return;
      event.preventDefault();
      openDetail(card.dataset.trip);
    });

    detailClose.addEventListener("click", closeDetail);
    detailOverlay.addEventListener("click", (event) => {
      if (event.target === detailOverlay) closeDetail();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && detailOverlay.classList.contains("open")) {
        closeDetail();
      }
    });

    search.addEventListener("input", render);
    render();
  </script>
