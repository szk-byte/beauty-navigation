<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>肌管理スマートナビ 美容成分＆美容医療の最適解</title>
  <style>
    :root {
      --bg: #fff8fb;
      --ink: #2a2027;
      --muted: #7d6874;
      --line: #f1dbe4;
      --card: #ffffff;
      --pink: #ef6f98;
      --hot: #d94875;
      --mint: #3db79b;
      --violet: #8060b3;
      --gold: #bf8b31;
      --shadow: 0 12px 30px rgba(171, 76, 112, .12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% -10%, rgba(239,111,152,.16), transparent 34%),
        radial-gradient(circle at 100% 0%, rgba(61,183,155,.13), transparent 28%),
        var(--bg);
      color: var(--ink);
      font-family: "Yu Gothic UI", "Meiryo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(1160px, 100%);
      margin: 0 auto;
      padding-bottom: 28px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      gap: 10px;
      padding: 12px 14px 10px;
      background: rgba(255,248,251,.92);
      border-bottom: 1px solid rgba(241,219,228,.86);
      backdrop-filter: blur(18px);
    }

    .brand-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5.2vw, 34px);
      line-height: 1.18;
      font-weight: 950;
      color: #2d1f27;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
    }

    .data-pill {
      display: grid;
      place-items: center;
      min-width: 72px;
      min-height: 54px;
      padding: 7px 9px;
      border: 1px solid #f0d8e2;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .data-pill strong { font-size: 20px; line-height: 1; }
    .data-pill span { margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 800; }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 44px;
      min-height: 46px;
      border: 2px solid #ffcddd;
      border-radius: 999px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(239,111,152,.1);
    }

    .search-row input {
      width: 100%;
      border: 0;
      outline: 0;
      padding: 0 16px;
      color: var(--ink);
      font-weight: 800;
      background: transparent;
    }

    .search-row button {
      border: 0;
      background: linear-gradient(135deg, #ff7a9f, #ffb06d);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    .screen {
      display: grid;
      gap: 12px;
      padding: 12px 12px 0;
    }

    .panel, .plan, .card, .empty {
      border: 1px solid rgba(255,255,255,.88);
      border-radius: var(--radius);
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow);
    }

    .filters {
      display: grid;
      gap: 12px;
      padding: 12px;
    }

    .axis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 6px;
      border-radius: 18px;
      background: #fff2f7;
    }

    .axis button {
      min-height: 34px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #7a5868;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .axis button.active {
      background: #2d1f27;
      color: #fff;
      box-shadow: 0 8px 18px rgba(45,31,39,.18);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: #8b6a79;
      font-size: 11px;
      font-weight: 900;
    }

    select {
      min-height: 42px;
      width: 100%;
      border: 1px solid #efcfdb;
      border-radius: 14px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      outline: 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow: visible;
      padding-bottom: 0;
    }

    .chip {
      flex: 0 1 auto;
      max-width: 100%;
      min-height: 34px;
      border: 1px solid #ffcddd;
      border-radius: 999px;
      padding: 7px 12px;
      background: #fff;
      color: #573746;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .chip.active {
      border-color: #2d1f27;
      background: #2d1f27;
      color: #fff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      min-height: 40px;
      border: 1px solid #efcfdb;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.primary {
      border: 0;
      background: linear-gradient(135deg, #2d1f27, #d94875);
      color: #fff;
    }

    .plan {
      overflow: hidden;
    }

    summary {
      list-style: none;
      cursor: pointer;
    }

    summary::-webkit-details-marker { display: none; }

    .plan-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      color: #fff;
      background: linear-gradient(135deg, #2d1f27, #d94875);
    }

    .plan-main h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .plan-main span {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.84);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.45;
    }

    .chev {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      transition: transform .16s ease;
    }

    details[open] > summary .chev { transform: rotate(90deg); }

    .steps {
      background: #fff;
    }

    .step {
      border-bottom: 1px solid #f4dce5;
    }

    .step:last-child { border-bottom: 0; }

    .step-head {
      display: grid;
      grid-template-columns: 34px 1fr 28px;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
    }

    .num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff789e, #ffba6f);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .step-title strong {
      display: block;
      color: #2d1f27;
      font-size: 14px;
      line-height: 1.25;
    }

    .step-title span {
      display: block;
      margin-top: 2px;
      color: #876b78;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 700;
    }

    .step-body {
      display: grid;
      gap: 10px;
      padding: 0 12px 13px 56px;
    }

    .step-body p {
      margin: 0;
      color: #725d67;
      font-size: 12px;
      line-height: 1.7;
    }

    .recommend {
      display: grid;
      gap: 6px;
    }

    .recommend b {
      color: #a84a6c;
      font-size: 11px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      background: #fff2f7;
      color: #573746;
      border: 1px solid #ffd6e3;
    }

    .tag.procedure {
      background: #f4efff;
      border-color: #e1d4ff;
      color: #5d3b7a;
    }

    .tag.ingredient {
      background: #effbf8;
      border-color: #ccefe6;
      color: #246b59;
    }

    .results-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
      padding: 2px;
    }

    .results-head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .results-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .results-head select {
      min-height: 38px;
      width: 108px;
      border-radius: 12px;
      font-size: 12px;
    }

    .list {
      display: grid;
      gap: 9px;
    }

    .card {
      display: grid;
      gap: 8px;
      padding: 12px;
      cursor: pointer;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .kind {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 7px;
      border-radius: 999px;
      color: #fff;
      font-size: 10px;
      font-weight: 950;
    }

    .kind.skin { background: var(--mint); }
    .kind.concern { background: var(--pink); }
    .kind.ingredient { background: var(--gold); }
    .kind.procedure { background: var(--violet); }

    .score {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .card h3 {
      margin: 0;
      color: #2d1f27;
      font-size: 17px;
      line-height: 1.25;
    }

    .summary {
      margin: 0;
      color: #6e5965;
      font-size: 12px;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-tags {
      display: flex;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
    }

    .mini-tags span {
      flex: 0 0 auto;
      padding: 4px 6px;
      border-radius: 999px;
      background: #fff2f7;
      color: #765064;
      font-size: 10px;
      font-weight: 800;
    }

    .empty {
      padding: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .external {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .external a {
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid #efcfdb;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: end;
      background: rgba(42,32,39,.42);
      padding: 10px;
    }

    .modal.open { display: flex; }

    .sheet {
      width: 100%;
      max-height: 86svh;
      overflow: auto;
      border-radius: 22px 22px 0 0;
      background: #fff;
      box-shadow: 0 -20px 60px rgba(42,32,39,.26);
    }

    .sheet-head {
      position: sticky;
      top: 0;
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 10px;
      padding: 14px;
      background: rgba(255,255,255,.95);
      border-bottom: 1px solid #f2dce5;
      backdrop-filter: blur(12px);
    }

    .sheet h2 {
      margin: 7px 0 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .close {
      width: 40px;
      height: 40px;
      border: 1px solid #efcfdb;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
    }

    .sheet-body {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .sheet-body p {
      margin: 0;
      color: #6e5965;
      font-size: 13px;
      line-height: 1.75;
    }

    .section {
      display: grid;
      gap: 6px;
    }

    .section h3 {
      margin: 0;
      color: #2d1f27;
      font-size: 13px;
    }

    body.lock { overflow: hidden; }

    @media (min-width: 860px) {
      .topbar {
        grid-template-columns: 1fr 420px;
        align-items: center;
        padding: 18px 20px;
      }
      .subtitle { font-size: 14px; }
      .screen {
        grid-template-columns: 340px 1fr;
        align-items: start;
        padding: 16px;
      }
      .filters {
        position: sticky;
        top: 110px;
      }
      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .modal {
        align-items: center;
        justify-content: center;
      }
      .sheet {
        max-width: 720px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-row">
        <div>
          <h1>肌管理スマートナビ 美容成分＆美容医療の最適解</h1>
          <p class="subtitle">最新成分 × 美容医療から導く、あなただけの肌育バイブル</p>
        </div>
        <div class="data-pill"><strong id="totalCount">490</strong><span>登録データ</span></div>
      </div>
      <div class="search-row">
        <input id="query" type="search" placeholder="赤み、PDRN、ブレッシングなど">
        <button id="clearSearch" type="button" aria-label="検索をクリア">×</button>
      </div>
    </header>

    <section class="screen">
      <aside class="panel filters">
        <nav class="axis" id="tabs" aria-label="検索軸">
          <button class="active" data-category="all" type="button">すべて</button>
          <button data-category="skin" type="button">肌質</button>
          <button data-category="concern" type="button">悩み</button>
          <button data-category="ingredient" type="button">成分</button>
          <button data-category="procedure" type="button">施術</button>
        </nav>
        <div class="field">
          <label for="skinSelect">肌質</label>
          <select id="skinSelect">
            <option value="">すべての肌質</option>
            <option value="普通肌">普通肌</option>
            <option value="乾燥肌">乾燥肌</option>
            <option value="脂性肌">脂性肌</option>
            <option value="混合肌">混合肌</option>
            <option value="敏感肌">敏感肌</option>
          </select>
        </div>
        <div class="field">
          <label>顔の部位</label>
          <div class="chips" id="areaChips">
            <button class="chip" data-area="全顔" type="button">全顔</button>
            <button class="chip" data-area="額" type="button">額</button>
            <button class="chip" data-area="眉間" type="button">眉間</button>
            <button class="chip" data-area="目元" type="button">目元</button>
            <button class="chip" data-area="頬" type="button">頬</button>
            <button class="chip" data-area="鼻" type="button">鼻</button>
            <button class="chip" data-area="口周り" type="button">口周り</button>
            <button class="chip" data-area="あご" type="button">あご</button>
            <button class="chip" data-area="フェイスライン" type="button">フェイスライン</button>
            <button class="chip" data-area="首" type="button">首</button>
          </div>
        </div>
        <div class="field">
          <label>よく使うキーワード</label>
          <div class="chips" id="quickChips">
            <button class="chip" data-word="赤み" type="button">赤み</button>
            <button class="chip" data-word="クレーター" type="button">クレーター</button>
            <button class="chip" data-word="毛穴" type="button">毛穴</button>
            <button class="chip" data-word="PDRN" type="button">PDRN</button>
            <button class="chip" data-word="ブレッシング" type="button">ブレッシング</button>
          </div>
        </div>
        <div class="field">
          <label>複合悩み</label>
          <div class="chips" id="concernChips">
            <button class="chip" data-concern="赤み" type="button">赤み</button>
            <button class="chip" data-concern="クレーター・ニキビ跡凹み" type="button">クレーター</button>
            <button class="chip" data-concern="毛穴の開き" type="button">毛穴</button>
            <button class="chip" data-concern="くすみ" type="button">くすみ</button>
            <button class="chip" data-concern="シミ・色素沈着" type="button">シミ</button>
            <button class="chip" data-concern="ニキビ" type="button">ニキビ</button>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="resetAll" type="button">リセット</button>
          <button class="btn" id="copyPlan" type="button">結果コピー</button>
        </div>
      </aside>

      <section class="content">
        <section class="plan" id="planPanel"></section>
        <div class="results-head">
          <div>
            <h2 id="resultTitle">すべての候補</h2>
            <p id="resultSubtitle">検索条件を選んでください。</p>
          </div>
          <select id="sortSelect" aria-label="並び替え">
            <option value="relevance">関連度</option>
            <option value="name">名前順</option>
            <option value="kind">カテゴリ</option>
          </select>
        </div>
        <div class="list" id="results"></div>
      </section>
    </section>
  </main>

  <div class="modal" id="detailBackdrop" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <section class="sheet">
      <div class="sheet-head">
        <div>
          <span class="kind" id="detailKind">詳細</span>
          <h2 id="detailTitle"></h2>
        </div>
        <button class="close" id="detailClose" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="sheet-body" id="detailContent"></div>
    </section>
  </div>

  <script>
    let ingredientNames = [];
    let procedureNames = [];

    const categories = [
      { id: "all", label: "すべて" },
      { id: "skin", label: "肌質" },
      { id: "concern", label: "悩み" },
      { id: "ingredient", label: "成分" },
      { id: "procedure", label: "施術" }
    ];

    const kindLabels = { skin: "肌質", concern: "悩み", ingredient: "成分", procedure: "施術" };

    const skinTypes = [
      ["普通肌", "水分と皮脂のバランスが比較的安定した肌。悩みに合わせて攻め成分や施術を選びやすい状態です。", ["ビタミンC", "ナイアシンアミド", "レチノール"], ["IPL", "ハイドラフェイシャル", "ジュベルック"]],
      ["乾燥肌", "水分保持力と皮脂膜が不足しやすく、つっぱり、粉ふき、小じわ、刺激感につながりやすい肌です。", ["セラミド", "ヒアルロン酸Na", "PDRN", "パンテノール"], ["リジュラン", "水光注射", "ケアシス"]],
      ["脂性肌", "皮脂量が多く、テカリ、毛穴詰まり、ニキビが出やすい肌。洗いすぎによる乾燥も見落とし注意です。", ["ナイアシンアミド", "アゼライン酸", "サリチル酸", "亜鉛PCA"], ["ハイドラフェイシャル", "ピーリング", "ポテンツァ", "ブレッシング"]],
      ["混合肌", "Tゾーンは皮脂が出やすく、頬や口元は乾燥しやすい肌。部位ごとの調整が重要です。", ["ナイアシンアミド", "セラミドNP", "ビタミンC", "アゼライン酸"], ["IPL", "ハイドラフェイシャル", "ポテンツァ"]],
      ["敏感肌", "赤み、ヒリつき、かゆみが出やすく、バリア機能低下や刺激反応が強い状態を含みます。", ["セラミドNP", "パンテノール", "CICA", "グリチルリチン酸2K"], ["LED治療", "ケアシス", "メソナJ", "リジュラン"]]
    ].map(([name, summary, fits, procedures]) => ({
      kind: "skin", name, summary, care: `${fits.join("、")}を中心に低刺激で組み立て、UVと摩擦対策を固定します。`, procedures: procedures.join("、"), tags: [name, ...fits, ...procedures]
    }));

    const concerns = [
      ["赤み", "炎症、乾燥、摩擦、酒さ傾向、ニキビ跡などで出る赤み。まず刺激因子を減らすことが土台です。", ["アゼライン酸", "ナイアシンアミド", "グリチルリチン酸2K", "CICA"], ["Vビーム", "IPL", "LED治療", "ケアシス"]],
      ["クレーター・ニキビ跡凹み", "真皮の構造変化を伴う凹み。スキンケア単独では限界があり、複数回の施術設計が必要になりやすい悩みです。", ["レチノール", "ペプチド", "PDRN", "ビタミンC"], ["ジュベルック", "ポテンツァ", "ダーマペン4", "サブシジョン"]],
      ["毛穴の開き", "皮脂、たるみ、乾燥、角栓、炎症後変化など原因が分かれるため、タイプ判定が重要です。", ["ナイアシンアミド", "アゼライン酸", "サリチル酸", "レチノール"], ["ハイドラフェイシャル", "ポテンツァ", "ブレッシング", "IPL"]],
      ["くすみ", "乾燥、角質肥厚、血行不良、色素沈着が混ざって暗く見える状態です。", ["ビタミンC", "トラネキサム酸", "ナイアシンアミド", "乳酸"], ["IPL", "ピコトーニング", "ピーリング", "エレクトロポレーション"]],
      ["シミ・色素沈着", "紫外線、炎症後色素沈着、肝斑などで対応が変わります。診断により施術選択が大きく変わります。", ["トラネキサム酸", "ビタミンC", "コウジ酸", "アルブチン"], ["ピコレーザー", "IPL", "イオン導入"]],
      ["ニキビ", "毛穴詰まり、皮脂、アクネ菌、炎症が関わる悩み。炎症が強い場合は皮膚科相談が重要です。", ["アゼライン酸", "サリチル酸", "ナイアシンアミド", "グリチルリチン酸2K"], ["ピーリング", "LED治療", "ハイドラフェイシャル", "ポテンツァ"]],
      ["乾燥小じわ", "角層水分量の低下で細かい線が目立つ状態。保湿で見え方が変わりやすいです。", ["セラミドNP", "ヒアルロン酸Na", "PDRN", "ペプチド"], ["リジュラン", "水光注射", "スネコス", "ケアシス"]],
      ["たるみ", "コラーゲン低下、脂肪・支持組織、骨格変化など複合的。層により施術選択が変わります。", ["レチノール", "ペプチド", "ビタミンC", "PDRN"], ["ハイフ", "ボルニューマ", "インモード", "ジュベルック"]]
    ].map(([name, summary, ingredients, procedures]) => ({
      kind: "concern", name, summary, care: `${ingredients.join("、")}を候補に、保湿とUVを固定します。`, procedures: procedures.join("、"), tags: [name, ...ingredients, ...procedures]
    }));

    function ingredientCategory(name) {
      if (/PDRN|PN|DNA|エクソソーム|幹細胞|EGF|FGF|ペプチド|NMN|NAD/.test(name)) return "肌育・ハリ";
      if (/ビタミンC|アスコル|ナイアシン|トラネキサム|コウジ|アルブチン|グルタチオン|4MSK|ルシノール/.test(name)) return "透明感";
      if (/セラミド|ヒアルロン|パンテノール|スクワラン|ワセリン|グリセリン|BG|ベタイン|トレハロース|エキス|水|油/.test(name)) return "保湿・バリア";
      if (/レチ|アゼライン|サリチル|グリコール|乳酸|マンデル|硫黄|亜鉛/.test(name)) return "毛穴・ニキビ";
      if (/酸化|チタン|亜鉛|ジメチコン|シリカ|マイカ/.test(name)) return "保護・UV";
      return "整肌";
    }

    function procedureCategory(name) {
      if (/ブレッシング|ポテンツァ|シルファーム|モフィウス|RF|ニードル/.test(name)) return "RF・ニードル";
      if (/PDRN|PN|リジュラン|ジュベルック|水光|スキンブースター|スネコス|プロファイロ|ジャルプロ|肌育/.test(name)) return "肌育・注入";
      if (/ピコ|レーザー|YAG|ルビー|アレキ|フラクショナル|Lase/.test(name)) return "レーザー";
      if (/IPL|フォト|ルメッカ|BBL|ライムライト|Vビーム|光治療|Lumi/.test(name)) return "光治療";
      if (/ピーリング|ピール|ハイドラ|アクア/.test(name)) return "ピーリング・毛穴";
      if (/ハイフ|ウルセラ|サーマ|ボルニューマ|インモード|Lift|Ultra|Sono/.test(name)) return "引き締め";
      if (/導入|ケアシス|メソナ|イオン|Meso/.test(name)) return "導入";
      return "美容施術";
    }

    let ingredients = [];
    let procedures = [];
    let data = [];

    async function loadCatalog() {
      try {
        const response = await fetch("codex-data.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const catalog = await response.json();
        ingredientNames = catalog.ingredientNames || [];
        procedureNames = catalog.procedureNames || [];
      } catch (error) {
        el.results.innerHTML = `<div class="empty">データを読み込めませんでした。GitHub Pagesでは codex.html と codex-data.json を同じ階層に置いてください。</div>`;
        throw error;
      }
      buildCatalog();
    }

    function buildCatalog() {
      ingredients = ingredientNames.map(name => {
        const category = ingredientCategory(name);
        const goodFor = {
          "肌育・ハリ": "ハリ不足、乾燥小じわ、肌質改善、施術後ケア",
          "透明感": "くすみ、シミ・色素沈着、色むら",
          "保湿・バリア": "乾燥、敏感肌、赤み、乾燥小じわ",
          "毛穴・ニキビ": "ニキビ、毛穴、皮脂、ざらつき",
          "保護・UV": "シミ予防、施術後ケア、光老化予防",
          "整肌": "ゆらぎ、肌荒れ、くすみ"
        }[category];
        return { kind: "ingredient", name, summary: `${name}は${category}系の美容成分。${goodFor}の候補として検索できます。`, mechanism: `${category}の目的に合わせて、角層環境、保湿、酸化、炎症、ターンオーバーなどを支える設計で使われます。`, goodFor, caution: "濃度、剤形、肌状態、併用成分により刺激性が変わります。", tags: [name, category, ...goodFor.split("、")] };
      });

      procedures = procedureNames.map(name => {
        const category = procedureCategory(name);
        const goodFor = {
          "RF・ニードル": "毛穴、ニキビ跡、赤み、ハリ不足",
          "肌育・注入": "乾燥小じわ、ハリ不足、肌質改善、クレーター",
          "レーザー": "シミ・色素沈着、くすみ、毛穴、クレーター",
          "光治療": "赤み、薄いシミ、くすみ、肌トーン",
          "ピーリング・毛穴": "ニキビ、毛穴詰まり、ざらつき、くすみ",
          "引き締め": "たるみ、フェイスライン、ハリ不足",
          "導入": "乾燥、くすみ、赤み、施術後ケア",
          "美容施術": "肌質改善、毛穴、くすみ"
        }[category];
        return { kind: "procedure", name, summary: `${name}は${category}に分類される美容施術。${goodFor}の相談候補として検索できます。`, features: `${category}は作用層、出力、薬剤、ダウンタイムが施術ごとに異なります。`, goodFor, caution: "適応、禁忌、回数、ダウンタイム、合併症リスクは医師診察で確認してください。", tags: [name, category, ...goodFor.split("、")] };
      });

      data = [...skinTypes, ...concerns, ...ingredients, ...procedures].map((item, index) => ({
        ...item,
        id: `${item.kind}-${index}`,
        searchable: Object.values(item).flat().join(" ").toLowerCase()
      }));
    }

    const quickWordsByCategory = {
      all: ["赤み", "クレーター", "毛穴", "乾燥肌", "敏感肌", "PDRN", "ブレッシング", "ジュベルック", "ポテンツァ", "シミ"],
      skin: ["普通肌", "乾燥肌", "脂性肌", "混合肌", "敏感肌"],
      concern: concerns.map(item => item.name),
      ingredient: ["PDRN", "ナイアシンアミド", "ビタミンC", "セラミドNP", "レチノール", "アゼライン酸", "トラネキサム酸", "ペプチド"],
      procedure: ["IPL", "ピコレーザー", "マイクロニードルRF", "スキンブースター", "PN注入", "PDLLA注入", "ダーマペン", "HIFU"]
    };

    const concernAliasWords = {
      "赤み": ["赤み", "敏感", "炎症", "アゼライン", "ナイアシン", "グリチル", "CICA", "セラミド", "パンテノール", "IPL", "LED", "Vビーム"],
      "クレーター・ニキビ跡凹み": ["クレーター", "ニキビ跡", "凹み", "真皮", "ジュベルック", "ポテンツァ", "ダーマペン", "サブシジョン", "レチ", "ペプチド", "PDRN", "PN", "ビタミンC"],
      "毛穴の開き": ["毛穴", "皮脂", "角栓", "ざらつき", "ナイアシン", "アゼライン", "サリチル", "レチ", "ビタミンC", "亜鉛", "ポテンツァ", "ブレッシング", "ハイドラ"],
      "くすみ": ["くすみ", "透明感", "角質", "色むら", "ビタミンC", "ナイアシン", "トラネキサム", "コウジ", "アルブチン", "乳酸", "IPL", "ピコ"],
      "シミ・色素沈着": ["シミ", "色素", "肝斑", "メラニン", "トラネキサム", "ビタミンC", "ナイアシン", "コウジ", "アルブチン", "4MSK", "ピコ", "IPL"],
      "ニキビ": ["ニキビ", "皮脂", "毛穴", "炎症", "アゼライン", "サリチル", "ナイアシン", "亜鉛", "硫黄", "グリチル", "ピーリング", "LED"],
      "乾燥小じわ": ["乾燥", "小じわ", "保湿", "バリア", "セラミド", "ヒアルロン", "パンテノール", "PDRN", "PN", "ペプチド", "リジュラン", "水光"],
      "たるみ": ["たるみ", "ハリ", "弾力", "フェイスライン", "レチ", "ペプチド", "ビタミンC", "ナイアシン", "PDRN", "PN", "ハイフ", "RF"]
    };

    const areaAliasWords = {
      "全顔": ["肌質", "くすみ", "毛穴", "赤み", "乾燥", "IPL", "ピコ", "導入", "PDRN", "ナイアシン"],
      "額": ["額", "皮脂", "ニキビ", "毛穴", "しわ", "ボトックス", "ピーリング", "アゼライン", "サリチル", "ナイアシン"],
      "眉間": ["眉間", "しわ", "表情じわ", "ボトックス", "レチ", "ペプチド", "ヒアルロン"],
      "目元": ["目元", "小じわ", "乾燥", "くま", "たるみ", "リジュラン", "スネコス", "PDRN", "ヒアルロン", "ペプチド"],
      "頬": ["頬", "赤み", "毛穴", "シミ", "くすみ", "クレーター", "IPL", "Vビーム", "ポテンツァ", "ジュベルック", "ビタミンC"],
      "鼻": ["鼻", "毛穴", "角栓", "皮脂", "黒ずみ", "ハイドラ", "ピーリング", "サリチル", "アゼライン", "ナイアシン"],
      "口周り": ["口周り", "乾燥", "ほうれい線", "たるみ", "小じわ", "ヒアルロン", "リジュラン", "セラミド", "ペプチド"],
      "あご": ["あご", "ニキビ", "皮脂", "毛穴", "炎症", "ピーリング", "LED", "アゼライン", "サリチル", "グリチル"],
      "フェイスライン": ["フェイスライン", "たるみ", "ハリ", "脂肪", "ハイフ", "インモード", "ボルニューマ", "RF", "レチ", "ペプチド"],
      "首": ["首", "しわ", "たるみ", "乾燥", "ハリ", "スネコス", "リジュラン", "ハイフ", "ペプチド", "レチ"]
    };

    const state = { category: "all", query: "", skin: "", area: "", quick: "", selectedConcerns: [], sort: "relevance" };
    const el = {
      tabs: document.querySelector("#tabs"),
      query: document.querySelector("#query"),
      clearSearch: document.querySelector("#clearSearch"),
      skinSelect: document.querySelector("#skinSelect"),
      areaChips: document.querySelector("#areaChips"),
      quickChips: document.querySelector("#quickChips"),
      concernChips: document.querySelector("#concernChips"),
      resetAll: document.querySelector("#resetAll"),
      copyPlan: document.querySelector("#copyPlan"),
      sortSelect: document.querySelector("#sortSelect"),
      totalCount: document.querySelector("#totalCount"),
      planPanel: document.querySelector("#planPanel"),
      resultTitle: document.querySelector("#resultTitle"),
      resultSubtitle: document.querySelector("#resultSubtitle"),
      results: document.querySelector("#results"),
      detailBackdrop: document.querySelector("#detailBackdrop"),
      detailKind: document.querySelector("#detailKind"),
      detailTitle: document.querySelector("#detailTitle"),
      detailContent: document.querySelector("#detailContent"),
      detailClose: document.querySelector("#detailClose")
    };

    function init() {
      el.totalCount.textContent = data.length;
      renderTabs();
      renderSkinOptions();
      renderAreaChips();
      renderQuickChips();
      renderConcernChips();
      bind();
      render();
    }

    function getQuickWords() { return quickWordsByCategory[state.category] || quickWordsByCategory.all; }

    function renderTabs() {
      el.tabs.innerHTML = categories.map(c => `<button class="${c.id === state.category ? "active" : ""}" data-category="${c.id}" type="button">${c.label}</button>`).join("");
    }

    function renderSkinOptions() {
      el.skinSelect.innerHTML = `<option value="">すべての肌質</option>` + skinTypes.map(s => `<option value="${s.name}">${s.name}</option>`).join("");
    }

    function renderQuickChips() {
      el.quickChips.innerHTML = getQuickWords().map(word => `<button class="chip ${word === state.quick ? "active" : ""}" data-word="${escapeHtml(word)}" type="button">${word}</button>`).join("");
    }

    function renderAreaChips() {
      el.areaChips.querySelectorAll("[data-area]").forEach(button => {
        button.classList.toggle("active", button.dataset.area === state.area);
      });
    }

    function renderConcernChips() {
      el.concernChips.innerHTML = concerns.map(c => `<button class="chip ${state.selectedConcerns.includes(c.name) ? "active" : ""}" data-concern="${escapeHtml(c.name)}" type="button">${c.name}</button>`).join("");
    }

    function bind() {
      el.tabs.addEventListener("click", event => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.category = button.dataset.category;
        state.query = "";
        state.quick = "";
        el.query.value = "";
        renderTabs();
        renderQuickChips();
        render();
      });

      el.quickChips.addEventListener("click", event => {
        const button = event.target.closest("[data-word]");
        if (!button) return;
        state.quick = state.quick === button.dataset.word ? "" : button.dataset.word;
        state.query = state.quick;
        el.query.value = state.query;
        renderQuickChips();
        render();
      });

      el.concernChips.addEventListener("click", event => {
        const button = event.target.closest("[data-concern]");
        if (!button) return;
        const word = button.dataset.concern;
        state.selectedConcerns = state.selectedConcerns.includes(word) ? state.selectedConcerns.filter(v => v !== word) : [...state.selectedConcerns, word];
        renderConcernChips();
        render();
      });

      el.areaChips.addEventListener("click", event => {
        const button = event.target.closest("[data-area]");
        if (!button) return;
        state.area = state.area === button.dataset.area ? "" : button.dataset.area;
        renderAreaChips();
        render();
      });

      el.query.addEventListener("input", event => {
        state.query = event.target.value.trim();
        state.quick = getQuickWords().includes(state.query) ? state.query : "";
        renderQuickChips();
        render();
      });

      el.clearSearch.addEventListener("click", () => {
        state.query = "";
        state.quick = "";
        el.query.value = "";
        renderQuickChips();
        render();
      });

      el.skinSelect.addEventListener("change", event => {
        state.skin = event.target.value;
        render();
      });

      el.sortSelect.addEventListener("change", event => {
        state.sort = event.target.value;
        render();
      });

      el.resetAll.addEventListener("click", () => {
        Object.assign(state, { category: "all", query: "", skin: "", area: "", quick: "", selectedConcerns: [], sort: "relevance" });
        el.query.value = "";
        el.skinSelect.value = "";
        el.sortSelect.value = "relevance";
        renderTabs();
        renderAreaChips();
        renderQuickChips();
        renderConcernChips();
        render();
      });

      el.copyPlan.addEventListener("click", async () => {
        const text = getFiltered().slice(0, 10).map(item => `${kindLabels[item.kind]}: ${item.name} - ${item.summary}`).join("\n");
        try {
          await navigator.clipboard.writeText(text);
          el.copyPlan.textContent = "コピー済み";
          setTimeout(() => el.copyPlan.textContent = "結果コピー", 1200);
        } catch {
          el.copyPlan.textContent = "コピー不可";
          setTimeout(() => el.copyPlan.textContent = "結果コピー", 1200);
        }
      });

      el.results.addEventListener("click", event => {
        const card = event.target.closest("[data-id]");
        if (card) openDetail(card.dataset.id);
      });

      el.detailClose.addEventListener("click", closeDetail);
      el.detailBackdrop.addEventListener("click", event => {
        if (event.target === el.detailBackdrop) closeDetail();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeDetail();
      });
    }

    function getFiltered() {
      const query = buildSearchQuery();
      let items = data.map(item => ({ ...item, score: scoreItem(item, query) }));
      if (state.category !== "all") items = items.filter(item => item.kind === state.category);
      if (query) items = items.filter(item => item.score > 0);
      if (state.skin) {
        const skinTerms = getSkinSearchTerms(state.skin);
        items = items.filter(item => item.kind === "skin" ? item.name === state.skin : matchesAnyTerm(item, skinTerms));
      }
      return sortItems(items);
    }

    function getSkinSearchTerms(skinName) {
      const skin = skinTypes.find(item => item.name === skinName);
      return [skinName, ...(skin?.tags || []), skin?.care, skin?.procedures]
        .filter(Boolean)
        .join(" ")
        .split(/[、\s]+/)
        .filter(term => term.length > 1);
    }

    function matchesAnyTerm(item, terms) {
      const text = normalize([item.name, item.summary, item.goodFor, item.care, item.procedures, item.features, ...(item.tags || [])].join(" "));
      return terms.some(term => text.includes(normalize(term)));
    }

    function buildSearchQuery() {
      const terms = [state.query, ...state.selectedConcerns, state.area];
      const expanded = terms.flatMap(term => [term, ...(concernAliasWords[term] || []), ...(areaAliasWords[term] || [])]);
      return normalize(expanded.join(" "));
    }

    function scoreItem(item, query) {
      if (!query) return 1;
      const target = normalize(item.searchable);
      const name = normalize(item.name);
      const tags = normalize((item.tags || []).join(" "));
      let score = 0;
      query.split(/\s+/).filter(Boolean).forEach(part => {
        if (name === part) score += 80;
        if (name.includes(part)) score += 40;
        if (tags.includes(part)) score += 24;
        if (target.includes(part)) score += 12;
      });
      return score;
    }

    function sortItems(items) {
      const copy = [...items];
      if (state.sort === "name") return copy.sort((a, b) => a.name.localeCompare(b.name, "ja"));
      if (state.sort === "kind") return copy.sort((a, b) => kindLabels[a.kind].localeCompare(kindLabels[b.kind], "ja") || b.score - a.score);
      return copy.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "ja"));
    }

    function render() {
      const items = getFiltered();
      const labels = [state.query, ...state.selectedConcerns, state.area, state.skin, state.category !== "all" ? categories.find(c => c.id === state.category).label : ""].filter(Boolean);
      el.resultTitle.textContent = labels.length ? `${labels.join(" / ")} の検索結果` : "すべての候補";
      el.resultSubtitle.textContent = `${items.length}件を表示中`;
      renderPlan();
      el.results.innerHTML = items.length ? items.map(renderCard).join("") : `<div class="empty">該当候補がありません。${renderExternalSearch(state.query || state.selectedConcerns.join(" ") || "美容 成分 施術")}</div>`;
    }

    function getDisplayFocusTerms() {
      return [...state.selectedConcerns, state.area, state.query, state.skin].filter(Boolean);
    }

    function getFocusTerms() {
      return [...state.selectedConcerns, state.area, state.query, state.skin]
        .filter(Boolean)
        .flatMap(term => [term, ...(concernAliasWords[term] || []), ...(areaAliasWords[term] || [])]);
    }

    function getSkinPatterns() {
      const map = {
        "乾燥肌": [/リジュラン|PDRN|PN|水光|スキンブースター|ケアシス|導入/, /セラミド|ヒアルロン|パンテノール|PDRN|PN|スクワラン|ペプチド/],
        "脂性肌": [/ハイドラ|ピーリング|LED|ポテンツァ|ブレッシング|IPL/, /ナイアシン|アゼライン|サリチル|亜鉛|硫黄|レチ/],
        "混合肌": [/ハイドラ|IPL|ポテンツァ|ブレッシング|導入/, /ナイアシン|セラミド|ビタミンC|アゼライン|ヒアルロン/],
        "敏感肌": [/LED|ケアシス|メソナ|導入|リジュラン|IPL/, /セラミド|パンテノール|CICA|グリチル|ヒアルロン|アラントイン/],
        "普通肌": [/IPL|ハイドラ|ピコ|ジュベルック|ポテンツァ|ブレッシング/, /ビタミンC|ナイアシン|レチ|セラミド|ペプチド|PDRN/]
      };
      return map[state.skin] || map["普通肌"];
    }

    function concernPatterns(term) {
      const rules = [
        [/赤み|敏感/, [/Vビーム|IPL|LED|ケアシス|シルファーム|ポテンツァ|ブレッシング/, /アゼライン|ナイアシン|グリチル|CICA|セラミド|パンテノール/]],
        [/クレーター|ニキビ跡|凹み/, [/ジュベルック|ポテンツァ|ブレッシング|ダーマペン|フラクショナル|サブシジョン|TCA/, /レチ|ペプチド|PDRN|PN|ビタミンC|ナイアシン/]],
        [/毛穴/, [/ポテンツァ|ブレッシング|ハイドラ|ピーリング|ダーマペン|IPL|RF/, /ナイアシン|アゼライン|サリチル|レチ|ビタミンC|亜鉛/]],
        [/くすみ/, [/IPL|フォト|ルメッカ|ピコトーニング|ピーリング|導入|ケアシス/, /ビタミンC|ナイアシン|トラネキサム|コウジ|アルブチン|乳酸/]],
        [/シミ|色素/, [/ピコ|IPL|フォト|トーニング|レーザー|導入/, /トラネキサム|ビタミンC|ナイアシン|コウジ|アルブチン|4MSK/]],
        [/ニキビ|皮脂/, [/ピーリング|ハイドラ|LED|ポテンツァ|ブレッシング|IPL/, /アゼライン|サリチル|ナイアシン|亜鉛|硫黄|グリチル/]],
        [/乾燥|小じわ/, [/リジュラン|PDRN|PN|水光|スキンブースター|ジュベルック|スネコス|導入/, /セラミド|ヒアルロン|パンテノール|PDRN|PN|ペプチド|スクワラン/]],
        [/たるみ|ハリ/, [/ハイフ|サーマ|ボルニューマ|インモード|ジュベルック|リジュラン|RF/, /レチ|ペプチド|ビタミンC|ナイアシン|PDRN|PN/]]
      ];
      return rules.filter(([pattern]) => pattern.test(term)).map(([, pair]) => pair);
    }

    function rank(list, type, stepPattern) {
      const terms = getFocusTerms();
      const [skinProcedure, skinIngredient] = getSkinPatterns();
      const patterns = [stepPattern, type === "procedure" ? skinProcedure : skinIngredient].filter(Boolean);
      terms.forEach(term => concernPatterns(term).forEach(pair => patterns.push(type === "procedure" ? pair[0] : pair[1])));
      const scored = new Map();
      list.forEach(item => {
        const hay = item.name + item.summary + (item.goodFor || "") + (item.tags || []).join(" ");
        let score = 0;
        patterns.forEach(pattern => { if (pattern.test(hay)) score += 4; });
        terms.forEach(term => { if (normalize(hay).includes(normalize(term))) score += 3; });
        if (score > 0) scored.set(item.name, { item, score: (scored.get(item.name)?.score || 0) + score });
      });
      return [...scored.values()].sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name, "ja")).map(v => v.item).concat(list);
    }

    function take(list, used, count) {
      const out = [];
      for (const item of list) {
        if (!item || used.has(item.name)) continue;
        used.add(item.name);
        out.push(item);
        if (out.length >= count) break;
      }
      return out;
    }

    function renderPlan() {
      const usedP = new Set();
      const usedI = new Set();
      const steps = [
        ["土台を整える", "刺激を減らして施術の反応を安定させる", "まず保湿、UV、摩擦回避を固定し、赤みや乾燥を落ち着かせます。", /LED|導入|ケアシス|メソナ|ハイドラ|IPL/, /セラミド|ヒアルロン|パンテノール|CICA|グリチル|PDRN|PN/],
        ["表層を整える", "毛穴・くすみ・色むらを先に整理", "毛穴詰まりやくすみがある場合、強い施術の前に表層を整えるとムラを減らしやすいです。", /ピーリング|ハイドラ|IPL|フォト|ルメッカ|ピコトーニング/, /ビタミンC|ナイアシン|トラネキサム|アゼライン|サリチル|乳酸/],
        ["主役施術を入れる", "主悩みに深く効かせる", "クレーター、毛穴、ハリ不足、たるみなど主悩みに合わせて軸になる施術を選びます。", /ブレッシング|ポテンツァ|ジュベルック|リジュラン|PDRN|PN|ピコ|フラクショナル|ダーマペン|ハイフ|RF/, /レチ|ペプチド|PDRN|PN|エクソソーム|ビタミンC|ナイアシン/],
        ["維持ケア", "次の施術まで肌状態をキープ", "施術後は乾燥、摩擦、炎症、紫外線を抑えながら目的成分を継続します。", /導入|LED|ケアシス|メソナ|水光|スキンブースター|IPL/, /酸化亜鉛|酸化チタン|ビタミンC|ナイアシン|トラネキサム|セラミド|ヒアルロン|パンテノール/]
      ];
      const focus = getFocusTerms();
      const displayFocus = getDisplayFocusTerms();
      el.planPanel.innerHTML = `
        <details open>
          <summary class="plan-main">
            <div><h2>おすすめ順</h2><span>${displayFocus.length ? displayFocus.join(" + ") : "肌質・悩みを選ぶと候補が変わります"}</span></div>
            <span class="chev">›</span>
          </summary>
          <div class="steps">
            ${steps.map((s, i) => {
              const ps = take(rank(procedures, "procedure", s[3]), usedP, i === 2 ? 5 : 4);
              const ing = take(rank(ingredients, "ingredient", s[4]), usedI, 5);
              return `
              <details class="step" ${i === 0 ? "open" : ""}>
                <summary class="step-head"><span class="num">${i + 1}</span><span class="step-title"><strong>${s[0]}</strong><span>${s[1]}</span></span><span class="chev">›</span></summary>
                <div class="step-body">
                  <p>${s[2]}</p>
                  ${recommend("候補施術", ps, "procedure")}
                  ${recommend("スキンケア成分", ing, "ingredient")}
                </div>
              </details>`;
            }).join("")}
          </div>
        </details>`;
    }

    function recommend(label, list, type) {
      const unique = [...new Map(list.filter(Boolean).map(item => [item.name, item])).values()].slice(0, type === "procedure" ? 5 : 5);
      if (!unique.length) return "";
      return `<div class="recommend"><b>${label}</b><div class="tag-row">${unique.map(item => `<span class="tag ${type}">${escapeHtml(item.name)}</span>`).join("")}</div></div>`;
    }

    function renderCard(item) {
      return `<article class="card" data-id="${item.id}"><div class="card-top"><span class="kind ${item.kind}">${kindLabels[item.kind]}</span><span class="score">関連度 ${item.score}</span></div><h3>${highlight(item.name)}</h3><p class="summary">${highlight(item.summary)}</p><div class="mini-tags">${(item.tags || []).slice(0, 4).map(tag => `<span>${highlight(tag)}</span>`).join("")}</div></article>`;
    }

    function openDetail(id) {
      const item = data.find(v => v.id === id);
      if (!item) return;
      el.detailKind.className = `kind ${item.kind}`;
      el.detailKind.textContent = kindLabels[item.kind];
      el.detailTitle.textContent = item.name;
      el.detailContent.innerHTML = `<p>${escapeHtml(item.summary)}</p>${detailRows(item).map(renderDetailSection).join("")}<section class="section"><h3>最新確認</h3>${renderExternalSearch(item.name)}</section>`;
      el.detailBackdrop.classList.add("open");
      document.body.classList.add("lock");
    }

    function closeDetail() {
      el.detailBackdrop.classList.remove("open");
      document.body.classList.remove("lock");
    }

    function detailRows(item) {
      const rows = [];
      if (item.care) rows.push(["改善策", item.care]);
      if (item.procedures) rows.push(["施術候補", item.procedures]);
      if (item.mechanism) rows.push(["作用メカニズム", item.mechanism]);
      if (item.features) rows.push(["施術内容・特徴", item.features]);
      if (item.goodFor) rows.push(["向いている悩み", item.goodFor]);
      rows.push(...deepDetailRows(item));
      if (item.caution) rows.push(["注意点", item.caution]);
      return rows;
    }

    function renderDetailSection([heading, text]) {
      return `<section class="section"><h3>${escapeHtml(heading)}</h3>${formatDetailText(text)}</section>`;
    }

    function formatDetailText(value) {
      const text = Array.isArray(value) ? value.join("、") : String(value || "");
      return text.split(/\n{2,}/).filter(Boolean).map(part => `<p>${escapeHtml(part)}</p>`).join("");
    }

    function deepDetailRows(item) {
      if (item.kind === "ingredient") return ingredientDetailRows(item);
      if (item.kind === "procedure") return procedureDetailRows(item);
      if (item.kind === "skin") return skinDetailRows(item);
      if (item.kind === "concern") return concernDetailRows(item);
      return [];
    }

    function ingredientDetailRows(item) {
      const category = ingredientCategory(item.name);
      const guide = {
        "肌育・ハリ": {
          target: "ハリ不足、乾燥小じわ、施術後のゆらぎ、肌の薄さが気になる時に候補になります。即効で形を変えるというより、肌の回復環境やうるおいの土台を支える目的で見ます。",
          pair: "セラミド、ヒアルロン酸、パンテノールなどの保湿・バリア系と合わせると、刺激を抑えながら続けやすくなります。毛穴やニキビ跡まで見たい場合は、ナイアシンアミド、ビタミンC、レチノール系を肌状態に合わせて少量から足します。"
        },
        "透明感": {
          target: "くすみ、色むら、シミ予防、炎症後の色素沈着を見たい時に候補になります。メラニンそのものだけでなく、紫外線、摩擦、乾燥、炎症でくすんで見える状態も一緒に整えるのが大切です。",
          pair: "朝はビタミンCやナイアシンアミド、夜はトラネキサム酸、コウジ酸、アルブチンなどを肌状態に合わせて選びます。日焼け止めを固定しないと効果実感がぶれやすいので、UV対策は必ずセットにします。"
        },
        "保湿・バリア": {
          target: "乾燥、赤み、敏感、つっぱり、皮むけ、施術後の不安定さがある時の土台成分です。攻めの成分を増やす前に、角層の水分保持とバリアを整える役割として考えます。",
          pair: "セラミド、ヒアルロン酸、グリセリン、スクワラン、パンテノール、CICA系を重ねると、保湿の層を作りやすくなります。レチノールや酸系を使う日は頻度を落とし、刺激が出たらまず保湿側へ戻します。"
        },
        "毛穴・ニキビ": {
          target: "毛穴の開き、皮脂、ざらつき、ニキビ、ニキビ跡の赤みが気になる時に候補になります。皮脂を抑えるだけでなく、角質詰まり、炎症、バリア低下を分けて見ると選びやすいです。",
          pair: "ナイアシンアミド、アゼライン酸、サリチル酸、亜鉛、グリチルリチン酸系と相性を見ます。乾燥しやすい人はセラミドやパンテノールを同時に入れ、ピーリング系は毎日使いにしない方が安定しやすいです。"
        },
        "保護・UV": {
          target: "シミ予防、施術後ケア、赤み悪化予防、光老化予防の基本になります。美容医療や美白成分を入れても、紫外線と摩擦が強いと戻りやすいため、守りの軸として考えます。",
          pair: "酸化亜鉛、酸化チタンなどのUV防御に加えて、ビタミンC、ナイアシンアミド、トラネキサム酸、セラミド系を目的に合わせて組み合わせます。日中は塗り直しや摩擦の少ない落とし方も大事です。"
        },
        "整肌": {
          target: "赤み、くすみ、肌荒れ、ゆらぎなど、複数の悩みが重なっている時に補助として候補になります。主役成分というより、肌状態を整えて他の成分や施術を受けやすくする役割で見ます。",
          pair: "保湿・バリア系をベースに、悩みが毛穴ならナイアシンアミド、くすみならビタミンC、赤みならグリチルリチン酸やCICA系を足します。刺激が読みにくい時は一度に増やさず、1つずつ反応を見ます。"
        }
      }[category];
      const matches = rank(ingredients.filter(v => v.name !== item.name), "ingredient").slice(0, 5).map(v => v.name).join("、");
      return [
        ["詳しい見方", `${item.name}は「${category}」の目的で使う候補です。${guide.target}\n\n同じ成分名でも、化粧水、美容液、クリーム、クリニック専売品で濃度や浸透感、刺激の出方が変わります。肌が敏感な時は効果の強さよりも継続できる処方かを優先し、赤みや皮むけが出る場合は頻度を落として様子を見ます。`],
        ["組み合わせの考え方", `${guide.pair}\n\nこの検索条件で一緒に見たい成分候補は、${matches || "セラミド、ナイアシンアミド、ビタミンC、ヒアルロン酸"}です。全部を同時に使う必要はなく、朝は守り、夜は悩みへのアプローチというように役割を分けると続けやすいです。`],
        ["スキンケアで選ぶ時", `成分表では${item.name}がどの位置にあるか、刺激になりやすい酸・レチノール・高濃度ビタミンCなどと同時に入っていないかを確認します。初めて使う時は顔全体にいきなり増やさず、数日おきに使って乾燥、赤み、かゆみ、ニキビの増え方を見ます。`]
      ];
    }

    function procedureDetailRows(item) {
      const category = procedureCategory(item.name);
      const guide = {
        "RF・ニードル": "毛穴、ニキビ跡、赤み、ハリ不足を同時に見たい時に候補になります。針や熱の刺激で肌の反応を促す設計が多く、出力や針深度で狙う層が変わります。",
        "肌育・注入": "乾燥小じわ、ハリ不足、肌質改善、クレーターの補助に使われます。表面を削る施術とは違い、肌内部のうるおいや弾力の環境を整える発想です。",
        "レーザー": "シミ、色素沈着、毛穴、クレーターなど、光や熱で狙いを絞りたい時に候補になります。種類によりメラニン、血管、真皮、表面の入れ替えなど目的が変わります。",
        "光治療": "赤み、薄いシミ、くすみ、色むら、肌全体のトーンを見たい時の候補です。強く一点を削るより、全顔の色調をまとめる目的で選ばれることが多いです。",
        "ピーリング・毛穴": "ざらつき、毛穴詰まり、くすみ、ニキビを整える入口として使いやすい施術です。主役施術の前に表面の詰まりを整えると、後の施術計画が組みやすくなります。",
        "引き締め": "たるみ、フェイスライン、ハリ不足を見たい時に候補になります。肌表面の色や毛穴より、熱や超音波で引き締め感や輪郭印象を狙う施術です。",
        "導入": "乾燥、赤み、施術後ケア、くすみ補助として使いやすい施術です。ダウンタイムを強く取りにくい時や、攻めの施術の合間に肌を落ち着かせる目的で入れます。",
        "美容施術": "肌悩みに合わせて医師やクリニックで適応を確認する施術です。名前が似ていても、機械、薬剤、出力、照射方法で向き不向きが大きく変わります。"
      }[category] || "肌悩みに合わせて医師やクリニックで適応を確認する施術です。";
      const procedureMatches = rank(procedures.filter(v => v.name !== item.name), "procedure").slice(0, 4).map(v => v.name).join("、");
      const ingredientMatches = rank(ingredients, "ingredient").slice(0, 5).map(v => v.name).join("、");
      return [
        ["詳しい見方", `${item.name}は「${category}」に入る施術候補です。${guide}\n\n検索上は${item.goodFor || "肌質改善、毛穴、くすみ、赤み、ハリ不足"}に関連付けていますが、実際には肌色、肝斑の有無、ニキビの活動性、痛みやダウンタイムの許容度で向き不向きが変わります。`],
        ["受ける順番の考え方", `赤みや乾燥が強い時は、いきなり強い主役施術に進まず、保湿・UV・摩擦対策と導入系やLED系で土台を整える方が反応が安定しやすいです。毛穴詰まりやくすみが強い時は、ピーリングやハイドラ系で表層を整えてから、${item.name}のような主役施術を検討します。\n\n次に比較したい施術候補は、${procedureMatches || "IPL、ポテンツァ、ジュベルック、ケアシス"}です。重複して受けるのではなく、悩みの優先順位に合わせて役割がかぶりすぎないように選びます。`],
        ["スキンケア併用", `施術前後は刺激の強いレチノール、ピーリング酸、高濃度ビタミンCを一時的に休む判断が必要になることがあります。基本はセラミド、ヒアルロン酸、パンテノール、CICA、ナイアシンアミドなどでバリアを守り、炎症と乾燥を増やさないことを優先します。\n\nこの条件で一緒に見たい成分候補は、${ingredientMatches || "セラミド、ヒアルロン酸、ナイアシンアミド、ビタミンC"}です。`]
      ];
    }

    function skinDetailRows(item) {
      return [
        ["ケアの組み立て方", `${item.name}では、肌質そのものを固定されたタイプとして見るより、今の水分量、皮脂量、赤み、刺激への弱さを分けて考えると選びやすいです。朝はUVと保湿、夜は洗浄しすぎないことと目的成分を少数に絞ることを優先します。\n\n攻めの成分や施術を増やす時は、まず2週間ほど土台ケアを固定してから変化を見ます。肌が荒れている時に一気に増やすと、何が合わなかったのか判断しにくくなります。`],
        ["施術との合わせ方", `候補施術は${item.procedures || "導入、光治療、肌育系"}です。乾燥や赤みがある場合は導入・LED・ケアシス系から、毛穴やくすみが中心ならピーリング・IPL系から、ハリ不足や凹凸が中心ならRF・肌育注入系を検討します。`]
      ];
    }

    function concernDetailRows(item) {
      return [
        ["悩みの分解", `${item.name}は、原因が1つとは限りません。乾燥、皮脂、炎症、紫外線、摩擦、ターンオーバー、真皮のハリ不足が重なって見えていることがあります。検索結果では関連しやすい成分と施術を出していますが、最初は一番目立つ原因を決めて、土台、表層、主役施術、維持ケアの順に整理すると選びやすいです。`],
        ["ホームケアと施術の役割", `ホームケアは毎日の炎症、乾燥、紫外線、皮脂を管理する役割です。施術はホームケアだけでは届きにくい色調、凹凸、ハリ、毛穴の深さに対して選びます。\n\n候補成分は${item.care || "保湿、UV、目的成分"}、候補施術は${item.procedures || "医師診察で適応確認"}です。まず守りを固定し、次に表層を整え、それでも残る主悩みに主役施術を入れる流れがおすすめです。`]
      ];
    }

    function renderExternalSearch(keyword) {
      const query = encodeURIComponent(`${keyword} 美容皮膚科 効果 適応 副作用 最新`);
      const scholar = encodeURIComponent(`${keyword} dermatology aesthetic treatment mechanism safety`);
      const jp = encodeURIComponent(`${keyword} 公式 美容皮膚科`);
      return `<div class="external"><a href="https://www.google.com/search?q=${query}" target="_blank" rel="noopener">Google</a><a href="https://scholar.google.com/scholar?q=${scholar}" target="_blank" rel="noopener">論文</a><a href="https://www.google.com/search?q=${jp}" target="_blank" rel="noopener">公式</a></div>`;
    }

    function normalize(value) { return String(value || "").toLowerCase().replace(/[・,、。／/]/g, " ").replace(/\s+/g, " ").trim(); }
    function escapeHtml(value) { return String(value || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])); }
    function highlight(value) {
      const q = normalize(state.query);
      const text = escapeHtml(value);
      if (!q) return text;
      const words = q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      return words.length ? text.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>") : text;
    }

    loadCatalog().then(init);
  </script>
</body>
</html>
