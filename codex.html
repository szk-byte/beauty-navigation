<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>肌管理スマートナビ 美容成分＆美容医療の最適解</title>
  <style>
    :root {
      --bg: #fff8fb;
      --ink: #2a2027;
      --muted: #7d6874;
      --line: #f1dbe4;
      --card: #ffffff;
      --pink: #ef6f98;
      --hot: #d94875;
      --mint: #3db79b;
      --violet: #8060b3;
      --gold: #bf8b31;
      --shadow: 0 12px 30px rgba(171, 76, 112, .12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% -10%, rgba(239,111,152,.16), transparent 34%),
        radial-gradient(circle at 100% 0%, rgba(61,183,155,.13), transparent 28%),
        var(--bg);
      color: var(--ink);
      font-family: "Yu Gothic UI", "Meiryo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(1160px, 100%);
      margin: 0 auto;
      padding-bottom: 28px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      gap: 10px;
      padding: 12px 14px 10px;
      background: rgba(255,248,251,.92);
      border-bottom: 1px solid rgba(241,219,228,.86);
      backdrop-filter: blur(18px);
    }

    .brand-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5.2vw, 34px);
      line-height: 1.18;
      font-weight: 950;
      color: #2d1f27;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
    }

    .data-pill {
      display: grid;
      place-items: center;
      min-width: 72px;
      min-height: 54px;
      padding: 7px 9px;
      border: 1px solid #f0d8e2;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .data-pill strong { font-size: 20px; line-height: 1; }
    .data-pill span { margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 800; }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 44px;
      min-height: 46px;
      border: 2px solid #ffcddd;
      border-radius: 999px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(239,111,152,.1);
    }

    .search-row input {
      width: 100%;
      border: 0;
      outline: 0;
      padding: 0 16px;
      color: var(--ink);
      font-weight: 800;
      background: transparent;
    }

    .search-row button {
      border: 0;
      background: linear-gradient(135deg, #ff7a9f, #ffb06d);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    .screen {
      display: grid;
      gap: 12px;
      padding: 12px 12px 0;
    }

    .panel, .plan, .card, .empty {
      border: 1px solid rgba(255,255,255,.88);
      border-radius: var(--radius);
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow);
    }

    .filters {
      display: grid;
      gap: 12px;
      padding: 12px;
    }

    .axis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 6px;
      border-radius: 18px;
      background: #fff2f7;
    }

    .axis button {
      min-height: 34px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #7a5868;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .axis button.active {
      background: #2d1f27;
      color: #fff;
      box-shadow: 0 8px 18px rgba(45,31,39,.18);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: #8b6a79;
      font-size: 11px;
      font-weight: 900;
    }

    select {
      min-height: 42px;
      width: 100%;
      border: 1px solid #efcfdb;
      border-radius: 14px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      outline: 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow: visible;
      padding-bottom: 0;
    }

    .chip {
      flex: 0 1 auto;
      max-width: 100%;
      min-height: 34px;
      border: 1px solid #ffcddd;
      border-radius: 999px;
      padding: 7px 12px;
      background: #fff;
      color: #573746;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .chip.active {
      border-color: #2d1f27;
      background: #2d1f27;
      color: #fff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      min-height: 40px;
      border: 1px solid #efcfdb;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.primary {
      border: 0;
      background: linear-gradient(135deg, #2d1f27, #d94875);
      color: #fff;
    }

    .plan {
      overflow: hidden;
    }

    summary {
      list-style: none;
      cursor: pointer;
    }

    summary::-webkit-details-marker { display: none; }

    .plan-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      color: #fff;
      background: linear-gradient(135deg, #2d1f27, #d94875);
    }

    .plan-main h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .plan-main span {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.84);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.45;
    }

    .chev {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      transition: transform .16s ease;
    }

    details[open] > summary .chev { transform: rotate(90deg); }

    .steps {
      background: #fff;
    }

    .step {
      border-bottom: 1px solid #f4dce5;
    }

    .step:last-child { border-bottom: 0; }

    .step-head {
      display: grid;
      grid-template-columns: 34px 1fr 28px;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
    }

    .num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff789e, #ffba6f);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .step-title strong {
      display: block;
      color: #2d1f27;
      font-size: 14px;
      line-height: 1.25;
    }

    .step-title span {
      display: block;
      margin-top: 2px;
      color: #876b78;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 700;
    }

    .step-body {
      display: grid;
      gap: 10px;
      padding: 0 12px 13px 56px;
    }

    .step-body p {
      margin: 0;
      color: #725d67;
      font-size: 12px;
      line-height: 1.7;
    }

    .recommend {
      display: grid;
      gap: 6px;
    }

    .recommend b {
      color: #a84a6c;
      font-size: 11px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      background: #fff2f7;
      color: #573746;
      border: 1px solid #ffd6e3;
    }

    .tag.procedure {
      background: #f4efff;
      border-color: #e1d4ff;
      color: #5d3b7a;
    }

    .tag.ingredient {
      background: #effbf8;
      border-color: #ccefe6;
      color: #246b59;
    }

    .results-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
      padding: 2px;
    }

    .results-head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .results-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .results-head select {
      min-height: 38px;
      width: 108px;
      border-radius: 12px;
      font-size: 12px;
    }

    .list {
      display: grid;
      gap: 9px;
    }

    .card {
      display: grid;
      gap: 8px;
      padding: 12px;
      cursor: pointer;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .kind {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 7px;
      border-radius: 999px;
      color: #fff;
      font-size: 10px;
      font-weight: 950;
    }

    .kind.skin { background: var(--mint); }
    .kind.concern { background: var(--pink); }
    .kind.ingredient { background: var(--gold); }
    .kind.procedure { background: var(--violet); }

    .score {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .card h3 {
      margin: 0;
      color: #2d1f27;
      font-size: 17px;
      line-height: 1.25;
    }

    .summary {
      margin: 0;
      color: #6e5965;
      font-size: 12px;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-tags {
      display: flex;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
    }

    .mini-tags span {
      flex: 0 0 auto;
      padding: 4px 6px;
      border-radius: 999px;
      background: #fff2f7;
      color: #765064;
      font-size: 10px;
      font-weight: 800;
    }

    .empty {
      padding: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .external {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .external a {
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid #efcfdb;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: end;
      background: rgba(42,32,39,.42);
      padding: 10px;
    }

    .modal.open { display: flex; }

    .sheet {
      width: 100%;
      max-height: 86svh;
      overflow: auto;
      border-radius: 22px 22px 0 0;
      background: #fff;
      box-shadow: 0 -20px 60px rgba(42,32,39,.26);
    }

    .sheet-head {
      position: sticky;
      top: 0;
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 10px;
      padding: 14px;
      background: rgba(255,255,255,.95);
      border-bottom: 1px solid #f2dce5;
      backdrop-filter: blur(12px);
    }

    .sheet h2 {
      margin: 7px 0 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .close {
      width: 40px;
      height: 40px;
      border: 1px solid #efcfdb;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
    }

    .sheet-body {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .sheet-body p {
      margin: 0;
      color: #6e5965;
      font-size: 13px;
      line-height: 1.75;
    }

    .section {
      display: grid;
      gap: 6px;
    }

    .section h3 {
      margin: 0;
      color: #2d1f27;
      font-size: 13px;
    }

    body.lock { overflow: hidden; }

    @media (min-width: 860px) {
      .topbar {
        grid-template-columns: 1fr 420px;
        align-items: center;
        padding: 18px 20px;
      }
      .subtitle { font-size: 14px; }
      .screen {
        grid-template-columns: 340px 1fr;
        align-items: start;
        padding: 16px;
      }
      .filters {
        position: sticky;
        top: 110px;
      }
      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .modal {
        align-items: center;
        justify-content: center;
      }
      .sheet {
        max-width: 720px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-row">
        <div>
          <h1>肌管理スマートナビ 美容成分＆美容医療の最適解</h1>
          <p class="subtitle">最新成分 × 美容医療から導く、あなただけの肌育バイブル</p>
        </div>
        <div class="data-pill"><strong id="totalCount">1013</strong><span>登録データ</span></div>
      </div>
      <div class="search-row">
        <input id="query" type="search" placeholder="赤み、PDRN、ブレッシングなど">
        <button id="clearSearch" type="button" aria-label="検索をクリア">×</button>
      </div>
    </header>

    <section class="screen">
      <aside class="panel filters">
        <nav class="axis" id="tabs" aria-label="検索軸">
          <button class="active" data-category="all" type="button">すべて</button>
          <button data-category="skin" type="button">肌質</button>
          <button data-category="concern" type="button">悩み</button>
          <button data-category="ingredient" type="button">成分</button>
          <button data-category="procedure" type="button">施術</button>
        </nav>
        <div class="field">
          <label for="skinSelect">肌質</label>
          <select id="skinSelect">
            <option value="">すべての肌質</option>
            <option value="普通肌">普通肌</option>
            <option value="乾燥肌">乾燥肌</option>
            <option value="脂性肌">脂性肌</option>
            <option value="混合肌">混合肌</option>
            <option value="敏感肌">敏感肌</option>
          </select>
        </div>
        <div class="field">
          <label>よく使うキーワード</label>
          <div class="chips" id="quickChips">
            <button class="chip" data-word="赤み" type="button">赤み</button>
            <button class="chip" data-word="クレーター" type="button">クレーター</button>
            <button class="chip" data-word="毛穴" type="button">毛穴</button>
            <button class="chip" data-word="PDRN" type="button">PDRN</button>
            <button class="chip" data-word="ブレッシング" type="button">ブレッシング</button>
          </div>
        </div>
        <div class="field">
          <label>複合悩み</label>
          <div class="chips" id="concernChips">
            <button class="chip" data-concern="赤み" type="button">赤み</button>
            <button class="chip" data-concern="クレーター・ニキビ跡凹み" type="button">クレーター</button>
            <button class="chip" data-concern="毛穴の開き" type="button">毛穴</button>
            <button class="chip" data-concern="くすみ" type="button">くすみ</button>
            <button class="chip" data-concern="シミ・色素沈着" type="button">シミ</button>
            <button class="chip" data-concern="ニキビ" type="button">ニキビ</button>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="resetAll" type="button">リセット</button>
          <button class="btn" id="copyPlan" type="button">結果コピー</button>
        </div>
      </aside>

      <section class="content">
        <section class="plan" id="planPanel"></section>
        <div class="results-head">
          <div>
            <h2 id="resultTitle">すべての候補</h2>
            <p id="resultSubtitle">検索条件を選んでください。</p>
          </div>
          <select id="sortSelect" aria-label="並び替え">
            <option value="relevance">関連度</option>
            <option value="name">名前順</option>
            <option value="kind">カテゴリ</option>
          </select>
        </div>
        <div class="list" id="results"></div>
      </section>
    </section>
  </main>

  <div class="modal" id="detailBackdrop" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <section class="sheet">
      <div class="sheet-head">
        <div>
          <span class="kind" id="detailKind">詳細</span>
          <h2 id="detailTitle"></h2>
        </div>
        <button class="close" id="detailClose" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="sheet-body" id="detailContent"></div>
    </section>

      kind: "concern", name, summary, care: `${ingredients.join("、")}を候補に、保湿とUVを固定します。`, procedures: procedures.join("、"), tags: [name, ...ingredients, ...procedures]
    }));

    function ingredientCategory(name) {
      if (/PDRN|PN|DNA|エクソソーム|幹細胞|EGF|FGF|ペプチド|NMN|NAD/.test(name)) return "肌育・ハリ";
      if (/ビタミンC|アスコル|ナイアシン|トラネキサム|コウジ|アルブチン|グルタチオン|4MSK|ルシノール/.test(name)) return "透明感";
      if (/セラミド|ヒアルロン|パンテノール|スクワラン|ワセリン|グリセリン|BG|ベタイン|トレハロース|エキス|水|油/.test(name)) return "保湿・バリア";
      if (/レチ|アゼライン|サリチル|グリコール|乳酸|マンデル|硫黄|亜鉛/.test(name)) return "毛穴・ニキビ";
      if (/酸化|チタン|亜鉛|ジメチコン|シリカ|マイカ/.test(name)) return "保護・UV";
      return "整肌";
    }

    function procedureCategory(name) {
      if (/ブレッシング|ポテンツァ|シルファーム|モフィウス|RF|ニードル/.test(name)) return "RF・ニードル";
      if (/PDRN|PN|リジュラン|ジュベルック|水光|スキンブースター|スネコス|プロファイロ|ジャルプロ|肌育/.test(name)) return "肌育・注入";
      if (/ピコ|レーザー|YAG|ルビー|アレキ|フラクショナル|Lase/.test(name)) return "レーザー";
      if (/IPL|フォト|ルメッカ|BBL|ライムライト|Vビーム|光治療|Lumi/.test(name)) return "光治療";
      if (/ピーリング|ピール|ハイドラ|アクア/.test(name)) return "ピーリング・毛穴";
      if (/ハイフ|ウルセラ|サーマ|ボルニューマ|インモード|Lift|Ultra|Sono/.test(name)) return "引き締め";
      if (/導入|ケアシス|メソナ|イオン|Meso/.test(name)) return "導入";
      return "美容施術";
    }

    const ingredients = ingredientNames.map(name => {
      const category = ingredientCategory(name);
      const goodFor = {
        "肌育・ハリ": "ハリ不足、乾燥小じわ、肌質改善、施術後ケア",
        "透明感": "くすみ、シミ・色素沈着、色むら",
        "保湿・バリア": "乾燥、敏感肌、赤み、乾燥小じわ",
        "毛穴・ニキビ": "ニキビ、毛穴、皮脂、ざらつき",
        "保護・UV": "シミ予防、施術後ケア、光老化予防",
        "整肌": "ゆらぎ、肌荒れ、くすみ"
      }[category];
      return { kind: "ingredient", name, summary: `${name}は${category}系の美容成分。${goodFor}の候補として検索できます。`, mechanism: `${category}の目的に合わせて、角層環境、保湿、酸化、炎症、ターンオーバーなどを支える設計で使われます。`, goodFor, caution: "濃度、剤形、肌状態、併用成分により刺激性が変わります。", tags: [name, category, ...goodFor.split("、")] };
    });

    const procedures = procedureNames.map(name => {
      const category = procedureCategory(name);
      const goodFor = {
        "RF・ニードル": "毛穴、ニキビ跡、赤み、ハリ不足",
        "肌育・注入": "乾燥小じわ、ハリ不足、肌質改善、クレーター",
        "レーザー": "シミ・色素沈着、くすみ、毛穴、クレーター",
        "光治療": "赤み、薄いシミ、くすみ、肌トーン",
        "ピーリング・毛穴": "ニキビ、毛穴詰まり、ざらつき、くすみ",
        "引き締め": "たるみ、フェイスライン、ハリ不足",
        "導入": "乾燥、くすみ、赤み、施術後ケア",
        "美容施術": "肌質改善、毛穴、くすみ"
      }[category];
      return { kind: "procedure", name, summary: `${name}は${category}に分類される美容施術。${goodFor}の相談候補として検索できます。`, features: `${category}は作用層、出力、薬剤、ダウンタイムが施術ごとに異なります。`, goodFor, caution: "適応、禁忌、回数、ダウンタイム、合併症リスクは医師診察で確認してください。", tags: [name, category, ...goodFor.split("、")] };
    });

    const data = [...skinTypes, ...concerns, ...ingredients, ...procedures].map((item, index) => ({
      ...item,
      id: `${item.kind}-${index}`,
      searchable: Object.values(item).flat().join(" ").toLowerCase()
    }));

    const quickWordsByCategory = {
      all: ["赤み", "クレーター", "毛穴", "乾燥肌", "敏感肌", "PDRN", "ブレッシング", "ジュベルック", "ポテンツァ", "シミ"],
      skin: ["普通肌", "乾燥肌", "脂性肌", "混合肌", "敏感肌"],
      concern: concerns.map(item => item.name),
      ingredient: ["PDRN", "ナイアシンアミド", "ビタミンC", "セラミドNP", "レチノール", "アゼライン酸", "トラネキサム酸", "ペプチド"],
      procedure: ["ブレッシング", "ポテンツァ", "ジュベルック", "リジュラン", "ピコレーザー", "IPL", "ダーマペン4", "ハイフ"]
    };

    const concernAliasWords = {
      "赤み": ["赤み", "敏感", "炎症", "アゼライン", "ナイアシン", "グリチル", "CICA", "セラミド", "パンテノール", "IPL", "LED", "Vビーム"],
      "クレーター・ニキビ跡凹み": ["クレーター", "ニキビ跡", "凹み", "真皮", "ジュベルック", "ポテンツァ", "ダーマペン", "サブシジョン", "レチ", "ペプチド", "PDRN", "PN", "ビタミンC"],
      "毛穴の開き": ["毛穴", "皮脂", "角栓", "ざらつき", "ナイアシン", "アゼライン", "サリチル", "レチ", "ビタミンC", "亜鉛", "ポテンツァ", "ブレッシング", "ハイドラ"],
      "くすみ": ["くすみ", "透明感", "角質", "色むら", "ビタミンC", "ナイアシン", "トラネキサム", "コウジ", "アルブチン", "乳酸", "IPL", "ピコ"],
      "シミ・色素沈着": ["シミ", "色素", "肝斑", "メラニン", "トラネキサム", "ビタミンC", "ナイアシン", "コウジ", "アルブチン", "4MSK", "ピコ", "IPL"],
      "ニキビ": ["ニキビ", "皮脂", "毛穴", "炎症", "アゼライン", "サリチル", "ナイアシン", "亜鉛", "硫黄", "グリチル", "ピーリング", "LED"],
      "乾燥小じわ": ["乾燥", "小じわ", "保湿", "バリア", "セラミド", "ヒアルロン", "パンテノール", "PDRN", "PN", "ペプチド", "リジュラン", "水光"],
      "たるみ": ["たるみ", "ハリ", "弾力", "フェイスライン", "レチ", "ペプチド", "ビタミンC", "ナイアシン", "PDRN", "PN", "ハイフ", "RF"]
    };

    const state = { category: "all", query: "", skin: "", quick: "", selectedConcerns: [], sort: "relevance" };
    const el = {
      tabs: document.querySelector("#tabs"),
      query: document.querySelector("#query"),
      clearSearch: document.querySelector("#clearSearch"),
      skinSelect: document.querySelector("#skinSelect"),
      quickChips: document.querySelector("#quickChips"),
      concernChips: document.querySelector("#concernChips"),
      resetAll: document.querySelector("#resetAll"),
      copyPlan: document.querySelector("#copyPlan"),
      sortSelect: document.querySelector("#sortSelect"),
      totalCount: document.querySelector("#totalCount"),
      planPanel: document.querySelector("#planPanel"),
      resultTitle: document.querySelector("#resultTitle"),
      resultSubtitle: document.querySelector("#resultSubtitle"),
      results: document.querySelector("#results"),
      detailBackdrop: document.querySelector("#detailBackdrop"),
      detailKind: document.querySelector("#detailKind"),
      detailTitle: document.querySelector("#detailTitle"),
      detailContent: document.querySelector("#detailContent"),
      detailClose: document.querySelector("#detailClose")
    };

    function init() {
      el.totalCount.textContent = data.length;
      renderTabs();
      renderSkinOptions();
      renderQuickChips();
      renderConcernChips();
      bind();
      render();
    }

    function getQuickWords() { return quickWordsByCategory[state.category] || quickWordsByCategory.all; }

    function renderTabs() {
      el.tabs.innerHTML = categories.map(c => `<button class="${c.id === state.category ? "active" : ""}" data-category="${c.id}" type="button">${c.label}</button>`).join("");
    }

    function renderSkinOptions() {
      el.skinSelect.innerHTML = `<option value="">すべての肌質</option>` + skinTypes.map(s => `<option value="${s.name}">${s.name}</option>`).join("");
    }

    function renderQuickChips() {
      el.quickChips.innerHTML = getQuickWords().map(word => `<button class="chip ${word === state.quick ? "active" : ""}" data-word="${escapeHtml(word)}" type="button">${word}</button>`).join("");
    }

    function renderConcernChips() {
      el.concernChips.innerHTML = concerns.map(c => `<button class="chip ${state.selectedConcerns.includes(c.name) ? "active" : ""}" data-concern="${escapeHtml(c.name)}" type="button">${c.name}</button>`).join("");
    }

    function bind() {
      el.tabs.addEventListener("click", event => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.category = button.dataset.category;
        state.query = "";
        state.quick = "";
        el.query.value = "";
        renderTabs();
        renderQuickChips();
        render();
      });

      el.quickChips.addEventListener("click", event => {
        const button = event.target.closest("[data-word]");
        if (!button) return;
        state.quick = state.quick === button.dataset.word ? "" : button.dataset.word;
        state.query = state.quick;
        el.query.value = state.query;
        renderQuickChips();
        render();
      });

      el.concernChips.addEventListener("click", event => {
        const button = event.target.closest("[data-concern]");
        if (!button) return;
        const word = button.dataset.concern;
        state.selectedConcerns = state.selectedConcerns.includes(word) ? state.selectedConcerns.filter(v => v !== word) : [...state.selectedConcerns, word];
        renderConcernChips();
        render();
      });

      el.query.addEventListener("input", event => {
        state.query = event.target.value.trim();
        state.quick = getQuickWords().includes(state.query) ? state.query : "";
        renderQuickChips();
        render();
      });

      el.clearSearch.addEventListener("click", () => {
        state.query = "";
        state.quick = "";
        el.query.value = "";
        renderQuickChips();
        render();
      });

      el.skinSelect.addEventListener("change", event => {
        state.skin = event.target.value;
        render();
      });

      el.sortSelect.addEventListener("change", event => {
        state.sort = event.target.value;
        render();
      });

      el.resetAll.addEventListener("click", () => {
        Object.assign(state, { category: "all", query: "", skin: "", quick: "", selectedConcerns: [], sort: "relevance" });
        el.query.value = "";
        el.skinSelect.value = "";
        el.sortSelect.value = "relevance";
        renderTabs();
        renderQuickChips();
        renderConcernChips();
        render();
      });

      el.copyPlan.addEventListener("click", async () => {
        const text = getFiltered().slice(0, 10).map(item => `${kindLabels[item.kind]}: ${item.name} - ${item.summary}`).join("\n");
        try {
          await navigator.clipboard.writeText(text);
          el.copyPlan.textContent = "コピー済み";
          setTimeout(() => el.copyPlan.textContent = "結果コピー", 1200);
        } catch {
          el.copyPlan.textContent = "コピー不可";
          setTimeout(() => el.copyPlan.textContent = "結果コピー", 1200);
        }
      });

      el.results.addEventListener("click", event => {
        const card = event.target.closest("[data-id]");
        if (card) openDetail(card.dataset.id);
      });

      el.detailClose.addEventListener("click", closeDetail);
      el.detailBackdrop.addEventListener("click", event => {
        if (event.target === el.detailBackdrop) closeDetail();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeDetail();
      });
    }

    function getFiltered() {
      const query = buildSearchQuery();
      let items = data.map(item => ({ ...item, score: scoreItem(item, query) }));
      if (state.category !== "all") items = items.filter(item => item.kind === state.category);
      if (query) items = items.filter(item => item.score > 0);
      if (state.skin) {
        const skinWord = normalize(state.skin);
        items = items.filter(item => item.kind === "skin" ? item.name === state.skin : normalize(item.searchable).includes(skinWord) || normalize((item.tags || []).join(" ")).includes(skinWord) || item.kind === "ingredient" || item.kind === "procedure");
      }
      return sortItems(items);
    }

    function buildSearchQuery() {
      const terms = [state.query, ...state.selectedConcerns];
      const expanded = terms.flatMap(term => [term, ...(concernAliasWords[term] || [])]);
      return normalize(expanded.join(" "));
    }

    function scoreItem(item, query) {
      if (!query) return 1;
      const target = normalize(item.searchable);
      const name = normalize(item.name);
      const tags = normalize((item.tags || []).join(" "));
      let score = 0;
      query.split(/\s+/).filter(Boolean).forEach(part => {
        if (name === part) score += 80;
        if (name.includes(part)) score += 40;
        if (tags.includes(part)) score += 24;
        if (target.includes(part)) score += 12;
      });
      return score;
    }

    function sortItems(items) {
      const copy = [...items];
      if (state.sort === "name") return copy.sort((a, b) => a.name.localeCompare(b.name, "ja"));
      if (state.sort === "kind") return copy.sort((a, b) => kindLabels[a.kind].localeCompare(kindLabels[b.kind], "ja") || b.score - a.score);
      return copy.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "ja"));
    }

    function render() {
      const items = getFiltered();
      const labels = [state.query, ...state.selectedConcerns, state.skin, state.category !== "all" ? categories.find(c => c.id === state.category).label : ""].filter(Boolean);
      el.resultTitle.textContent = labels.length ? `${labels.join(" / ")} の検索結果` : "すべての候補";
      el.resultSubtitle.textContent = `${items.length}件を表示中`;
      renderPlan();
      el.results.innerHTML = items.length ? items.slice(0, 80).map(renderCard).join("") : `<div class="empty">該当候補がありません。${renderExternalSearch(state.query || state.selectedConcerns.join(" ") || "美容 成分 施術")}</div>`;
    }

    function getFocusTerms() {
      return [...state.selectedConcerns, state.query, state.skin]
        .filter(Boolean)
        .flatMap(term => [term, ...(concernAliasWords[term] || [])]);
    }

    function getSkinPatterns() {
      const map = {
        "乾燥肌": [/リジュラン|PDRN|PN|水光|スキンブースター|ケアシス|導入/, /セラミド|ヒアルロン|パンテノール|PDRN|PN|スクワラン|ペプチド/],
        "脂性肌": [/ハイドラ|ピーリング|LED|ポテンツァ|ブレッシング|IPL/, /ナイアシン|アゼライン|サリチル|亜鉛|硫黄|レチ/],
        "混合肌": [/ハイドラ|IPL|ポテンツァ|ブレッシング|導入/, /ナイアシン|セラミド|ビタミンC|アゼライン|ヒアルロン/],
        "敏感肌": [/LED|ケアシス|メソナ|導入|リジュラン|IPL/, /セラミド|パンテノール|CICA|グリチル|ヒアルロン|アラントイン/],
        "普通肌": [/IPL|ハイドラ|ピコ|ジュベルック|ポテンツァ|ブレッシング/, /ビタミンC|ナイアシン|レチ|セラミド|ペプチド|PDRN/]
      };
      return map[state.skin] || map["普通肌"];
    }

    function concernPatterns(term) {
      const rules = [
        [/赤み|敏感/, [/Vビーム|IPL|LED|ケアシス|シルファーム|ポテンツァ|ブレッシング/, /アゼライン|ナイアシン|グリチル|CICA|セラミド|パンテノール/]],
        [/クレーター|ニキビ跡|凹み/, [/ジュベルック|ポテンツァ|ブレッシング|ダーマペン|フラクショナル|サブシジョン|TCA/, /レチ|ペプチド|PDRN|PN|ビタミンC|ナイアシン/]],
        [/毛穴/, [/ポテンツァ|ブレッシング|ハイドラ|ピーリング|ダーマペン|IPL|RF/, /ナイアシン|アゼライン|サリチル|レチ|ビタミンC|亜鉛/]],
        [/くすみ/, [/IPL|フォト|ルメッカ|ピコトーニング|ピーリング|導入|ケアシス/, /ビタミンC|ナイアシン|トラネキサム|コウジ|アルブチン|乳酸/]],
        [/シミ|色素/, [/ピコ|IPL|フォト|トーニング|レーザー|導入/, /トラネキサム|ビタミンC|ナイアシン|コウジ|アルブチン|4MSK/]],
        [/ニキビ|皮脂/, [/ピーリング|ハイドラ|LED|ポテンツァ|ブレッシング|IPL/, /アゼライン|サリチル|ナイアシン|亜鉛|硫黄|グリチル/]],
        [/乾燥|小じわ/, [/リジュラン|PDRN|PN|水光|スキンブースター|ジュベルック|スネコス|導入/, /セラミド|ヒアルロン|パンテノール|PDRN|PN|ペプチド|スクワラン/]],
        [/たるみ|ハリ/, [/ハイフ|サーマ|ボルニューマ|インモード|ジュベルック|リジュラン|RF/, /レチ|ペプチド|ビタミンC|ナイアシン|PDRN|PN/]]
      ];
      return rules.filter(([pattern]) => pattern.test(term)).map(([, pair]) => pair);
    }

    function rank(list, type, stepPattern) {
      const terms = getFocusTerms();
      const [skinProcedure, skinIngredient] = getSkinPatterns();
      const patterns = [stepPattern, type === "procedure" ? skinProcedure : skinIngredient].filter(Boolean);
      terms.forEach(term => concernPatterns(term).forEach(pair => patterns.push(type === "procedure" ? pair[0] : pair[1])));
      const scored = new Map();
      list.forEach(item => {
        const hay = item.name + item.summary + (item.goodFor || "") + (item.tags || []).join(" ");
        let score = 0;
        patterns.forEach(pattern => { if (pattern.test(hay)) score += 4; });
        terms.forEach(term => { if (normalize(hay).includes(normalize(term))) score += 3; });
        if (score > 0) scored.set(item.name, { item, score: (scored.get(item.name)?.score || 0) + score });
      });
      return [...scored.values()].sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name, "ja")).map(v => v.item).concat(list);
    }

    function take(list, used, count) {
      const out = [];
      for (const item of list) {
        if (!item || used.has(item.name)) continue;
        used.add(item.name);
        out.push(item);
        if (out.length >= count) break;
      }
      return out;
    }

    function renderPlan() {
      const usedP = new Set();
      const usedI = new Set();
      const steps = [
        ["土台を整える", "刺激を減らして施術の反応を安定させる", "まず保湿、UV、摩擦回避を固定し、赤みや乾燥を落ち着かせます。", /LED|導入|ケアシス|メソナ|ハイドラ|IPL/, /セラミド|ヒアルロン|パンテノール|CICA|グリチル|PDRN|PN/],
        ["表層を整える", "毛穴・くすみ・色むらを先に整理", "毛穴詰まりやくすみがある場合、強い施術の前に表層を整えるとムラを減らしやすいです。", /ピーリング|ハイドラ|IPL|フォト|ルメッカ|ピコトーニング/, /ビタミンC|ナイアシン|トラネキサム|アゼライン|サリチル|乳酸/],
        ["主役施術を入れる", "主悩みに深く効かせる", "クレーター、毛穴、ハリ不足、たるみなど主悩みに合わせて軸になる施術を選びます。", /ブレッシング|ポテンツァ|ジュベルック|リジュラン|PDRN|PN|ピコ|フラクショナル|ダーマペン|ハイフ|RF/, /レチ|ペプチド|PDRN|PN|エクソソーム|ビタミンC|ナイアシン/],
        ["維持ケア", "次の施術まで肌状態をキープ", "施術後は乾燥、摩擦、炎症、紫外線を抑えながら目的成分を継続します。", /導入|LED|ケアシス|メソナ|水光|スキンブースター|IPL/, /酸化亜鉛|酸化チタン|ビタミンC|ナイアシン|トラネキサム|セラミド|ヒアルロン|パンテノール/]
      ];
      const focus = getFocusTerms();
      el.planPanel.innerHTML = `
        <details open>
          <summary class="plan-main">
            <div><h2>おすすめ順</h2><span>${focus.length ? focus.join(" + ") : "肌質・悩みを選ぶと候補が変わります"}</span></div>
            <span class="chev">›</span>
          </summary>
          <div class="steps">
            ${steps.map((s, i) => {
              const ps = take(rank(procedures, "procedure", s[3]), usedP, i === 2 ? 5 : 4);
              const ing = take(rank(ingredients, "ingredient", s[4]), usedI, 5);
              return `
              <details class="step" ${i === 0 ? "open" : ""}>
                <summary class="step-head"><span class="num">${i + 1}</span><span class="step-title"><strong>${s[0]}</strong><span>${s[1]}</span></span><span class="chev">›</span></summary>
                <div class="step-body">
                  <p>${s[2]}</p>
                  ${recommend("候補施術", ps, "procedure")}
                  ${recommend("スキンケア成分", ing, "ingredient")}
                </div>
              </details>`;
            }).join("")}
          </div>
        </details>`;
    }

    function recommend(label, list, type) {
      const unique = [...new Map(list.filter(Boolean).map(item => [item.name, item])).values()].slice(0, type === "procedure" ? 5 : 5);
      if (!unique.length) return "";
      return `<div class="recommend"><b>${label}</b><div class="tag-row">${unique.map(item => `<span class="tag ${type}">${escapeHtml(item.name)}</span>`).join("")}</div></div>`;
    }

    function renderCard(item) {
      return `<article class="card" data-id="${item.id}"><div class="card-top"><span class="kind ${item.kind}">${kindLabels[item.kind]}</span><span class="score">関連度 ${item.score}</span></div><h3>${highlight(item.name)}</h3><p class="summary">${highlight(item.summary)}</p><div class="mini-tags">${(item.tags || []).slice(0, 4).map(tag => `<span>${highlight(tag)}</span>`).join("")}</div></article>`;
    }

    function openDetail(id) {
      const item = data.find(v => v.id === id);
      if (!item) return;
      el.detailKind.className = `kind ${item.kind}`;
      el.detailKind.textContent = kindLabels[item.kind];
      el.detailTitle.textContent = item.name;
      el.detailContent.innerHTML = `<p>${escapeHtml(item.summary)}</p>${detailRows(item).map(([h, p]) => `<section class="section"><h3>${h}</h3><p>${escapeHtml(Array.isArray(p) ? p.join("、") : p)}</p></section>`).join("")}<section class="section"><h3>最新確認</h3>${renderExternalSearch(item.name)}</section>`;
      el.detailBackdrop.classList.add("open");
      document.body.classList.add("lock");
    }

    function closeDetail() {
      el.detailBackdrop.classList.remove("open");
      document.body.classList.remove("lock");
    }

    function detailRows(item) {
      const rows = [];
      if (item.care) rows.push(["改善策", item.care]);
      if (item.procedures) rows.push(["施術候補", item.procedures]);
      if (item.mechanism) rows.push(["作用メカニズム", item.mechanism]);
      if (item.features) rows.push(["施術内容・特徴", item.features]);
      if (item.goodFor) rows.push(["向いている悩み", item.goodFor]);
      if (item.caution) rows.push(["注意点", item.caution]);
      return rows;
    }

    function renderExternalSearch(keyword) {
      const query = encodeURIComponent(`${keyword} 美容皮膚科 効果 適応 副作用 最新`);
      const scholar = encodeURIComponent(`${keyword} dermatology aesthetic treatment mechanism safety`);
      const jp = encodeURIComponent(`${keyword} 公式 美容皮膚科`);
      return `<div class="external"><a href="https://www.google.com/search?q=${query}" target="_blank" rel="noopener">Google</a><a href="https://scholar.google.com/scholar?q=${scholar}" target="_blank" rel="noopener">論文</a><a href="https://www.google.com/search?q=${jp}" target="_blank" rel="noopener">公式</a></div>`;
    }

    function normalize(value) { return String(value || "").toLowerCase().replace(/[・,、。／/]/g, " ").replace(/\s+/g, " ").trim(); }
    function escapeHtml(value) { return String(value || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])); }
    function highlight(value) {
      const q = normalize(state.query);
      const text = escapeHtml(value);
      if (!q) return text;
      const words = q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      return words.length ? text.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>") : text;
    }

    init();
  </script>
</body>
</html>
