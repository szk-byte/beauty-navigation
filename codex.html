<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>肌管理スマートナビ 美容成分＆美容医療の最適解</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f5;
      --ink: #24302d;
      --muted: #6c7772;
      --line: #dfe5df;
      --panel: #ffffff;
      --soft: #edf4ef;
      --mint: #5f9f88;
      --coral: #d96f5f;
      --gold: #b58b32;
      --plum: #7a5f8d;
      --blue: #497b9d;
      --shadow: 0 18px 50px rgba(34, 49, 45, 0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(247,248,245,0.96), rgba(247,248,245,0.90)),
        radial-gradient(circle at 12% 18%, rgba(217,111,95,0.14), transparent 24%),
        radial-gradient(circle at 82% 12%, rgba(95,159,136,0.14), transparent 26%),
        var(--bg);
      color: var(--ink);
      font-family: "Yu Gothic UI", "Meiryo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }

    .app-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: end;
      padding: 12px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.02;
      font-weight: 800;
    }

    .tagline {
      margin: 10px 0 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
    }

    .status {
      display: grid;
      gap: 8px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .status strong { font-size: 26px; line-height: 1; }
    .status span { color: var(--muted); font-size: 12px; line-height: 1.5; }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
      margin-top: 18px;
    }

    .controls {
      display: grid;
      gap: 14px;
    }

    .panel, .result-card, .empty {
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 28px rgba(34, 49, 45, 0.08);
    }

    .panel { padding: 16px; }

    .panel h2, .results-head h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .searchbox {
      display: grid;
      grid-template-columns: 1fr 42px;
      border: 1px solid #cfd8d1;
      background: #fff;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .searchbox input {
      width: 100%;
      border: 0;
      outline: 0;
      padding: 13px 14px;
      color: var(--ink);
      background: transparent;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 42px;
      min-height: 42px;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--soft);
      color: var(--ink);
      cursor: pointer;
    }

    .tabs, .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab, .chip, .quick {
      border: 1px solid #cfd8d1;
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .tab {
      padding: 9px 12px;
      font-size: 13px;
    }

    .chip, .quick {
      padding: 8px 10px;
      font-size: 12px;
    }

    .tab:hover, .chip:hover, .quick:hover { transform: translateY(-1px); }

    .tab.active, .chip.active, .quick.active {
      background: #24302d;
      border-color: #24302d;
      color: #fff;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cfd8d1;
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      outline: 0;
    }

    .skin-visual {
      position: relative;
      min-height: 150px;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(95,159,136,0.12), rgba(217,111,95,0.08)),
        #fff;
    }

    .face-map {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 118px;
      height: 118px;
      border-radius: 50% 50% 46% 46%;
      background:
        radial-gradient(circle at 35% 39%, #24302d 0 3px, transparent 4px),
        radial-gradient(circle at 65% 39%, #24302d 0 3px, transparent 4px),
        radial-gradient(ellipse at 50% 64%, transparent 0 15px, rgba(36,48,45,0.5) 16px 17px, transparent 18px),
        linear-gradient(150deg, #f3c7bb, #f5d9c7 44%, #e8b8aa);
      box-shadow: inset 10px -12px 28px rgba(217,111,95,0.2), 0 12px 28px rgba(36,48,45,0.18);
    }

    .face-map::before, .face-map::after {
      content: "";
      position: absolute;
      top: 47px;
      width: 24px;
      height: 12px;
      border-radius: 50%;
      background: rgba(217,111,95,0.32);
      filter: blur(.2px);
    }

    .face-map::before { left: 16px; }
    .face-map::after { right: 16px; }

    .visual-copy {
      position: relative;
      z-index: 1;
      max-width: 190px;
    }

    .visual-copy strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .visual-copy span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .results {
      display: grid;
      gap: 14px;
    }

    .results-head {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: end;
    }

    .sort-group {
      display: flex;
      gap: 8px;
      flex-direction: column;
      align-items: stretch;
    }

    .sort-group select { width: 100%; }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .result-card {
      display: grid;
      gap: 10px;
      padding: 16px;
      min-height: 168px;
      cursor: pointer;
      text-align: left;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .result-card:hover,
    .result-card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(95,159,136,0.65);
      box-shadow: 0 16px 34px rgba(34, 49, 45, 0.13);
      outline: 0;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .kind {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 5px 8px;
      border-radius: 999px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .kind.skin { background: var(--mint); }
    .kind.concern { background: var(--coral); }
    .kind.ingredient { background: var(--gold); }
    .kind.procedure { background: var(--plum); }

    .score {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .result-card h3 {
      margin: 0;
      font-size: 21px;
      line-height: 1.25;
    }

    .summary {
      margin: 0;
      color: #43504b;
      line-height: 1.75;
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .meta-list li {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 8px;
      color: #43504b;
      font-size: 13px;
      line-height: 1.55;
    }

    .meta-list b {
      color: var(--ink);
      font-size: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }

    .tag {
      padding: 5px 7px;
      border-radius: 999px;
      background: #f0f4f1;
      color: #52605a;
      font-size: 11px;
    }

    .open-hint {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--mint);
      font-size: 12px;
      font-weight: 800;
    }

    .external-search {
      display: grid;
      gap: 10px;
      margin-top: 6px;
      padding: 12px;
      border: 1px solid #dfe5df;
      border-radius: var(--radius);
      background: #f8faf7;
    }

    .external-search p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #cfd8d1;
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .notice {
      padding: 12px 14px;
      border: 1px solid #ead9b8;
      border-radius: var(--radius);
      background: #fff8e8;
      color: #6f5621;
      font-size: 12px;
      line-height: 1.7;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ghost {
      border: 1px solid #cfd8d1;
      background: #fff;
      color: var(--ink);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .primary {
      border: 1px solid #24302d;
      background: #24302d;
      color: #fff;
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    mark {
      background: rgba(217,111,95,0.22);
      color: inherit;
      padding: 0 2px;
      border-radius: 4px;
    }

    .detail-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: end;
      justify-content: center;
      background: rgba(21, 31, 28, 0.42);
      padding: 12px;
    }

    .detail-backdrop.open { display: flex; }

    .detail-sheet {
      width: min(760px, 100%);
      max-height: min(86vh, 780px);
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -18px 60px rgba(21, 31, 28, 0.24);
    }

    .detail-header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 10px;
      align-items: start;
      padding: 16px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .detail-header h2 {
      margin: 8px 0 0;
      font-size: 24px;
      line-height: 1.25;
    }

    .detail-close {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid #cfd8d1;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .detail-content {
      display: grid;
      gap: 16px;
      padding: 16px;
    }

    .detail-summary {
      display: block;
      margin: 0;
      color: #43504b;
      font-size: 15px;
      line-height: 1.8;
    }

    .detail-section {
      display: grid;
      gap: 8px;
      padding-top: 2px;
    }

    .detail-section h3 {
      margin: 0;
      color: var(--ink);
      font-size: 13px;
    }

    .detail-section p {
      margin: 0;
      color: #43504b;
      line-height: 1.75;
      font-size: 14px;
    }

    body.modal-open { overflow: hidden; }

    @media (max-width: 1040px) {
      .layout { grid-template-columns: 1fr; }
      .controls { position: static; }
      .result-grid { grid-template-columns: 1fr; }
      header { grid-template-columns: 1fr; }
      .status { min-width: 0; }
    }

    @media (max-width: 620px) {
      .app-shell { padding: 14px; }
      .results-head { grid-template-columns: 1fr; }
      .sort-group { align-items: stretch; flex-direction: column; }
      .sort-group select { width: 100%; }
      .meta-list li { grid-template-columns: 1fr; }
      .face-map { opacity: .38; right: 8px; }
      .visual-copy { max-width: 100%; padding-right: 72px; }
    }

    @media (min-width: 760px) {
      .app-shell { padding: 22px; }
      header { grid-template-columns: 1fr auto; }
      .status { min-width: 230px; }
      .results-head { grid-template-columns: 1fr auto; }
      .sort-group {
        flex-direction: row;
        align-items: center;
      }
      .sort-group select { width: 190px; }
      .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-backdrop { align-items: center; padding: 22px; }
      .detail-sheet { border-radius: var(--radius); }
    }

    @media (min-width: 1040px) {
      .layout { grid-template-columns: 340px 1fr; }
      .controls {
        position: sticky;
        top: 16px;
      }
    }


    /* Beauty planner refresh */
    :root {
      --bg: #fff7fa;
      --ink: #30252b;
      --muted: #7e6975;
      --line: #f0d8e2;
      --soft: #fff0f5;
      --mint: #39a98f;
      --coral: #ee6f7e;
      --gold: #c79637;
      --plum: #9b5ca7;
      --shadow: 0 20px 54px rgba(174, 78, 115, 0.16);
    }

    body {
      background:
        linear-gradient(180deg, rgba(255,247,250,0.92), rgba(248,255,251,0.94)),
        radial-gradient(circle at 18% 0%, rgba(255,118,153,0.22), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(94,203,174,0.18), transparent 24%),
        radial-gradient(circle at 55% 62%, rgba(246,198,92,0.13), transparent 28%),
        var(--bg);
    }

    header {
      min-height: 190px;
      padding: 26px 0 22px;
      border-bottom: 0;
    }

    h1 {
      max-width: 780px;
      color: #24171f;
      font-size: clamp(36px, 9vw, 78px);
      line-height: .92;
      text-wrap: balance;
    }

    h1::after {
      content: "Glow plan, not guesswork.";
      display: block;
      margin-top: 10px;
      color: #e45d83;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .tagline {
      color: #765f6c;
      font-weight: 600;
    }

    .panel, .result-card, .empty, .status, .plan-panel {
      border: 1px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .panel h2, .results-head h2 {
      color: #33212b;
      font-size: 17px;
      font-weight: 900;
    }

    .skin-visual {
      min-height: 184px;
      background:
        linear-gradient(140deg, rgba(255,118,153,0.24), rgba(94,203,174,0.16)),
        linear-gradient(45deg, #fff, #fff6fb);
    }

    .visual-copy strong {
      color: #2b1d25;
      font-size: 24px;
      line-height: 1.2;
    }

    .searchbox {
      border: 1px solid #f0c9d8;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.75);
    }

    .searchbox input {
      min-height: 48px;
      font-weight: 700;
    }

    .icon-btn {
      background: linear-gradient(135deg, #ff7da1, #ffbd76);
      color: #fff;
      font-weight: 900;
    }

    .tab, .quick, .concern-chip, .ghost, .primary, .link-button {
      min-height: 38px;
      border-color: #efc9d8;
      box-shadow: 0 8px 18px rgba(174, 78, 115, 0.08);
      font-weight: 800;
    }

    .tab.active, .quick.active, .concern-chip.active {
      background: linear-gradient(135deg, #2b1d25, #e45d83);
      border-color: transparent;
      color: #fff;
    }

    .primary {
      border: 0;
      background: linear-gradient(135deg, #2b1d25, #e45d83);
      color: #fff;
    }

    .result-card {
      position: relative;
      overflow: hidden;
      min-height: 156px;
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, #ff7da1, #5ecbae, #ffbd76);
    }

    .result-card h3 {
      font-size: 22px;
      color: #2d2028;
    }

    .kind.skin { background: #39a98f; }

    .plan-panel {

      padding: 16px;
      border-radius: var(--radius);
    }

    .plan-panel h2 {
      margin: 0;
      font-size: 18px;
      color: #2d2028;
    }

    .plan-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .plan-steps {
      display: grid;
      gap: 10px;
    }

    .plan-step {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid #f0d8e2;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.72);
    }

    .step-num {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff7da1, #ffbd76);
      color: #fff;
      font-weight: 900;
    }

    .plan-step strong {
      display: block;
      margin-bottom: 4px;
      color: #2d2028;
      font-size: 14px;
    }

    .plan-step span {
      display: block;
      color: #6f5d67;
      font-size: 12px;
      line-height: 1.65;
    }

    .combo-count {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fff0f5;
      color: #c6426a;
      font-size: 12px;
      font-weight: 900;
    }



    /* Full planner redesign */
    body {
      background:
        linear-gradient(180deg, rgba(255,249,251,0.94), rgba(247,255,253,0.92)),
        radial-gradient(circle at 18% 4%, rgba(255,112,151,0.24), transparent 30%),
        radial-gradient(circle at 88% 8%, rgba(91,214,186,0.2), transparent 26%),
        #fff9fb;
    }

    .app-shell {
      padding: 0;
    }

    header {
      position: relative;
      overflow: hidden;
      min-height: 78svh;
      display: grid;
      align-items: end;
      padding: 24px 16px 26px;
      border: 0;
      background:
        linear-gradient(180deg, rgba(45, 23, 35, 0.16), rgba(45, 23, 35, 0.58)),
        url("https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?auto=format&fit=crop&w=1600&q=80") center/cover;
    }

    header::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 0;
      height: 1px;
      background: rgba(255,255,255,0.45);
    }

    header > div {
      position: relative;
      z-index: 1;
      max-width: 820px;
    }

    header .status {
      position: absolute;
      z-index: 2;
      top: 14px;
      right: 14px;
      width: min(210px, calc(100% - 28px));
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.76);
      color: #2d2028;
    }

    h1 {
      max-width: 760px;
      color: #fff;
      text-shadow: 0 16px 36px rgba(0,0,0,0.28);
    }

    h1::after {
      color: #ffd7e3;
      text-shadow: none;
    }

    header .tagline {
      max-width: 620px;
      color: rgba(255,255,255,0.92);
      font-size: 16px;
    }

    .layout {
      margin-top: 0;
      padding: 14px;
    }

    .controls {
      gap: 12px;
    }

    .skin-visual {
      display: none;
    }

    .panel {
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.82);
      background: rgba(255,255,255,0.86);
    }

    .panel h2 {
      margin-bottom: 14px;
      font-size: 19px;
    }

    .searchbox {
      border-radius: 18px;
      border: 2px solid #ffd1df;
      background: #fff;
    }

    .icon-btn {
      border-left: 0;
      border-radius: 0;
      font-size: 20px;
    }

    .tabs, .chips {
      gap: 9px;
    }

    .tab, .quick, .concern-chip {

    function buildAdvice(item) {
      const words = [item.name, ...(item.tags || [])].join(" ");
      const ingredientHits = expandedIngredients.filter(entry => entry.searchableSeed ? entry.searchableSeed.includes(words) : true);
      const matchIngredients = expandedIngredients
        .map(entry => ({ entry, score: overlapScore(words, [entry.name, entry.summary, entry.goodFor, ...(entry.tags || [])].join(" ")) }))
        .filter(hit => hit.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 8)
        .map(hit => hit.entry.name);
      const matchProcedures = expandedProcedures
        .map(entry => ({ entry, score: overlapScore(words, [entry.name, entry.summary, entry.goodFor, ...(entry.tags || [])].join(" ")) }))
        .filter(hit => hit.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 8)
        .map(hit => hit.entry.name);
      return {
        ...item,
        care: item.care ? `${item.care} 推奨成分候補: ${matchIngredients.slice(0, 5).join("、")}。` : `推奨成分候補: ${matchIngredients.slice(0, 5).join("、")}。`,
        procedures: item.procedures ? `${item.procedures} 施術候補: ${matchProcedures.slice(0, 5).join("、")}。` : `施術候補: ${matchProcedures.slice(0, 5).join("、")}。`,
        tags: [...new Set([...(item.tags || []), ...matchIngredients.slice(0, 2), ...matchProcedures.slice(0, 2)])]
      };
    }

    function overlapScore(a, b) {
      const source = normalize(a);
      const target = normalize(b);
      return source.split(" ").filter(word => word.length > 1 && target.includes(word)).length;
    }

    const enrichedSkinTypes = skinTypes.map(buildAdvice);
    const enrichedConcerns = concerns.map(buildAdvice);

    const data = [...enrichedSkinTypes, ...enrichedConcerns, ...expandedIngredients, ...expandedProcedures].map((item, index) => ({
      ...item,
      id: `${item.kind}-${index}`,
      searchable: Object.values(item).flat().join(" ").toLowerCase()
    }));

    const kindLabels = {
      skin: "肌質",
      concern: "お悩み",
      ingredient: "成分",
      procedure: "施術"
    };

    const quickWordsByCategory = {
      all: ["赤み", "クレーター", "毛穴", "乾燥肌", "敏感肌", "PDRN", "ブレッシング", "ジュベルック", "ポテンツァ", "シミ"],
      skin: ["普通肌", "乾燥肌", "脂性肌", "混合肌", "敏感肌"],

      ingredient: ["PDRN", "ナイアシンアミド", "ビタミンC", "セラミド", "レチノール", "アゼライン酸", "トラネキサム酸", "ペプチド"],
      procedure: ["ブレッシング", "ポテンツァ", "ジュベルック", "リジュラン", "ピコレーザー", "IPL", "ダーマペン", "ハイフ"]
    };

    function getQuickWords() {
      return quickWordsByCategory[state.category] || quickWordsByCategory.all;
    }

    const state = {
      category: "all",
      query: "",
      skin: "",
      quick: "",
      selectedConcerns: [],
      sort: "relevance"
    };

    const el = {
      tabs: document.querySelector("#tabs"),
      query: document.querySelector("#query"),
      clearSearch: document.querySelector("#clearSearch"),
      skinSelect: document.querySelector("#skinSelect"),
      quickChips: document.querySelector("#quickChips"),
      concernChips: document.querySelector("#concernChips"),
      results: document.querySelector("#results"),
      resultTitle: document.querySelector("#resultTitle"),
      resultSubtitle: document.querySelector("#resultSubtitle"),
      sortSelect: document.querySelector("#sortSelect"),
      totalCount: document.querySelector("#totalCount"),
      resetAll: document.querySelector("#resetAll"),

      planPanel: document.querySelector("#planPanel"),
      detailBackdrop: document.querySelector("#detailBackdrop"),

      detailTitle: document.querySelector("#detailTitle"),

      detailClose: document.querySelector("#detailClose")
    };

    function init() {
      el.totalCount.textContent = data.length;
      renderTabs();
      renderSkinOptions();
      renderQuickChips();
      renderConcernChips();
      bindEvents();
      render();
    }

    function renderTabs() {
      el.tabs.innerHTML = categories.map(category => (
        `<button class="tab ${category.id === state.category ? "active" : ""}" data-category="${category.id}">${category.label}</button>`
      )).join("");
    }

    function renderSkinOptions() {
      el.skinSelect.innerHTML += skinTypes.map(skin => `<option value="${skin.name}">${skin.name}</option>`).join("");
    }

    function renderQuickChips() {
      el.quickChips.innerHTML = getQuickWords().map(word => (
        `<button class="quick ${word === state.quick ? "active" : ""}" data-word="${word}">${word}</button>`
      )).join("");
    }

    function renderConcernChips() {
      const concernWords = concerns.map(item => item.name);
      el.concernChips.innerHTML = concernWords.map(word => (
        `<button class="quick concern-chip ${state.selectedConcerns.includes(word) ? "active" : ""}" data-concern="${word}">${word}</button>`
      )).join("");
    }

    function bindEvents() {
      el.tabs.addEventListener("click", event => {
        const button = event.target.closest("button[data-category]");
        if (!button) return;
        state.category = button.dataset.category;
        state.quick = "";
        state.query = "";
        el.query.value = "";
        renderTabs();
        renderQuickChips();
        render();
      });

      el.quickChips.addEventListener("click", event => {
        const button = event.target.closest("button[data-word]");
        if (!button) return;
        const selected = button.dataset.word;
        state.quick = state.quick === selected ? "" : selected;
        el.query.value = state.quick;
        state.query = state.quick;
        renderQuickChips();
        render();
      });

      el.concernChips.addEventListener("click", event => {
        const button = event.target.closest("button[data-concern]");
        if (!button) return;
        const selected = button.dataset.concern;
        state.selectedConcerns = state.selectedConcerns.includes(selected)
          ? state.selectedConcerns.filter(word => word !== selected)
          : [...state.selectedConcerns, selected];
        renderConcernChips();
        render();
      });

      el.query.addEventListener("input", event => {
        state.query = event.target.value.trim();
        state.quick = getQuickWords().includes(state.query) ? state.query : "";
        renderQuickChips();
        render();
      });

      el.clearSearch.addEventListener("click", () => {
        state.query = "";
        state.quick = "";
        el.query.value = "";
        renderQuickChips();
        render();
      });

      el.skinSelect.addEventListener("change", event => {
        state.skin = event.target.value;
        render();
      });

      el.sortSelect.addEventListener("change", event => {
        state.sort = event.target.value;
        render();
      });

      el.resetAll.addEventListener("click", () => {
        state.category = "all";
        state.query = "";
        state.skin = "";
        state.quick = "";
        state.selectedConcerns = [];
        state.sort = "relevance";
        el.query.value = "";
        el.skinSelect.value = "";
        el.sortSelect.value = "relevance";
        renderTabs();
        renderQuickChips();
        renderConcernChips();
        render();
      });

      el.copyPlan.addEventListener("click", async () => {
        const lines = getFiltered().slice(0, 8).map(item => `${kindLabels[item.kind]}: ${item.name} - ${item.summary}`);
        const text = `Beauty Skin Finder 検索結果\n条件: ${state.query || "指定なし"} / ${state.skin || "肌質指定なし"}\n\n${lines.join("\n")}`;
        try {
          await navigator.clipboard.writeText(text);
          el.copyPlan.textContent = "コピーしました";
          setTimeout(() => { el.copyPlan.textContent = "表示結果をコピー"; }, 1200);
        } catch (error) {
          el.copyPlan.textContent = "コピー不可";
          setTimeout(() => { el.copyPlan.textContent = "表示結果をコピー"; }, 1200);
        }
      });

      el.results.addEventListener("click", event => {
        const card = event.target.closest("[data-id]");
        if (!card) return;
        openDetail(card.dataset.id);
      });

      el.results.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-id]");
        if (!card) return;
        event.preventDefault();
        openDetail(card.dataset.id);
      });

      el.detailClose.addEventListener("click", closeDetail);
      el.detailBackdrop.addEventListener("click", event => {
        if (event.target === el.detailBackdrop) closeDetail();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && el.detailBackdrop.classList.contains("open")) {
          closeDetail();
        }
      });
    }

    function getFiltered() {
      const query = normalize([state.query, ...state.selectedConcerns].join(" "));
      let items = data.map(item => ({ ...item, score: scoreItem(item, query) }));

      if (state.category !== "all") {
        items = items.filter(item => item.kind === state.category);
      }

      if (query) {
        items = items.filter(item => item.score > 0);
      }

      if (state.skin) {
        const skinWord = normalize(state.skin);
        items = items.filter(item => {
          if (item.kind === "skin") return item.name === state.skin;
          return normalize(item.searchable).includes(skinWord) || normalize((item.tags || []).join(" ")).includes(skinWord);
        });
      }

      return sortItems(items);
    }

    function scoreItem(item, query) {
      if (!query) return 1;
      const target = normalize(item.searchable);
      const name = normalize(item.name);
      const tags = normalize((item.tags || []).join(" "));
      let score = 0;
      if (name === query) score += 80;
      if (name.includes(query)) score += 45;
      if (tags.includes(query)) score += 28;
      if (target.includes(query)) score += 16;
      query.split(/\s+/).filter(Boolean).forEach(part => {
        if (part !== query && target.includes(part)) score += 6;
      });
      return score;
    }

    function sortItems(items) {
      const copy = [...items];
      if (state.sort === "name") return copy.sort((a, b) => a.name.localeCompare(b.name, "ja"));
      if (state.sort === "kind") return copy.sort((a, b) => kindLabels[a.kind].localeCompare(kindLabels[b.kind], "ja") || b.score - a.score);
      return copy.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "ja"));
    }

    function render() {
      const items = getFiltered();
      const categoryLabel = categories.find(category => category.id === state.category).label;
      const selectedLabel = state.selectedConcerns.length ? state.selectedConcerns.join(" + ") : "";
      const detail = [
        state.query ? `「${state.query}」` : "",
        selectedLabel,
        state.skin ? state.skin : "",
        categoryLabel !== "すべて" ? categoryLabel : ""
      ].filter(Boolean).join(" / ");

      el.resultTitle.textContent = detail ? `${detail} の検索結果` : "すべての候補";
      el.resultSubtitle.textContent = `${items.length}件を表示中。複数悩みを選ぶと推奨順も更新されます。`;
      renderPlan(items);

      if (!items.length) {
        el.results.innerHTML = `
          <div class="empty">
            <p>該当する候補がありません。キーワードを短くするか、悩みの選択を減らしてください。</p>
            ${renderExternalSearch(state.query || state.selectedConcerns.join(" ") || "美容 成分 施術 最新")}
          </div>
        `;
        return;
      }

      el.results.innerHTML = items.map(renderCard).join("");
    }

    function getConcernPatterns(term) {
      const map = [
        [/赤み|敏感|酒さ/, {
          procedure: /Vビーム|IPL|フォト|LED|ケアシス|メソナ|シルファーム|ポテンツァ|ブレッシング/,

        }],
        [/クレーター|ニキビ跡|凹み/, {
          procedure: /ジュベルック|ポテンツァ|ブレッシング|ダーマペン|フラクショナル|ピコフラクショナル|サブシジョン|TCA/,
          ingredient: /レチ|ペプチド|PDRN|PN|ビタミンC|ナイアシン|セラミド/

        [/毛穴/, {

        }],
        [/くすみ/, {
          procedure: /IPL|フォト|ルメッカ|ピコトーニング|ピーリング|導入|ケアシス|メソナ/,
          ingredient: /ビタミンC|ナイアシン|トラネキサム|コウジ|アルブチン|グルタチオン|乳酸|マンデル/
        }],
        [/シミ|色素|肝斑/, {
          procedure: /ピコ|IPL|フォト|トーニング|レーザー|エレクトロ|イオン|導入/,
          ingredient: /トラネキサム|ビタミンC|ナイアシン|コウジ|アルブチン|4MSK|ルシノール/
        }],
        [/ニキビ|皮脂/, {
          procedure: /ピーリング|ハイドラ|LED|ポテンツァ|ブレッシング|IPL|アクア/,
          ingredient: /アゼライン|サリチル|ナイアシン|亜鉛|硫黄|グリチル|レチ/
        }],
        [/乾燥|小じわ/, {
          procedure: /リジュラン|PDRN|PN|水光|スキンブースター|ジュベルック|スネコス|導入|ケアシス/,
          ingredient: /セラミド|ヒアルロン|パンテノール|PDRN|PN|ペプチド|スクワラン|ヘパリン/
        }],
        [/たるみ|ハリ|フェイスライン/, {
          procedure: /ハイフ|サーマ|ボルニューマ|オリジオ|デンシティ|インモード|ジュベルック|リジュラン|RF/,
          ingredient: /レチ|ペプチド|ビタミンC|ナイアシン|PDRN|PN|コエンザイム|フラーレン/
        }]

      return map.filter(([pattern]) => pattern.test(term)).map(([, value]) => value);
    }

    function getSkinPlanPatterns(skinName) {
      const map = {
        "乾燥肌": {
          foundationIngredient: /セラミド|ヒアルロン|パンテノール|ヘパリン|スクワラン|PDRN|PN|保湿|バリア/,

          coreProcedure: /リジュラン|ジュベルック|PDRN|PN|水光|スネコス|プロファイロ|スキンブースター/,
          maintenanceIngredient: /セラミド|ヒアルロン|パンテノール|ペプチド|PDRN|PN|スクワラン/

      return map[skinName] || map["普通肌"];

    function mergePattern(a, b) {
      return new RegExp(`${a.source}|${b.source}`);
    }

    function scoreRecommendations(list, focusTerms, type, stepPattern) {
      const scores = new Map();
      const patterns = [];
      if (stepPattern) patterns.push(stepPattern);
      focusTerms.forEach(term => {
        getConcernPatterns(term).forEach(patternsForTerm => {
          patterns.push(type === "procedure" ? patternsForTerm.procedure : patternsForTerm.ingredient);
        });
      });
      if (state.skin) {
        const skinPatterns = getSkinPlanPatterns(state.skin);
        patterns.push(type === "procedure"
          ? mergePattern(skinPatterns.foundationProcedure, skinPatterns.coreProcedure)
          : mergePattern(skinPatterns.foundationIngredient, skinPatterns.maintenanceIngredient));
      }

      list.forEach(item => {
        const haystack = item.name + item.summary + (item.goodFor || "") + (item.tags || []).join(" ");
        let score = 0;
        patterns.forEach(pattern => {
          if (pattern.test(haystack)) score += 4;
        });
        focusTerms.forEach(term => {
          if (normalize(haystack).includes(normalize(term))) score += 3;
        });
        if (state.skin && normalize(haystack).includes(normalize(state.skin))) score += 2;
        if (score > 0 && !scores.has(item.name)) {
          scores.set(item.name, { item, score });
        } else if (score > 0 && scores.has(item.name)) {
          scores.get(item.name).score += score;
        }
      });

      return [...scores.values()]
        .sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name, "ja"))
        .map(entry => entry.item);
    }

    function takeUnique(list, used, count) {
      const output = [];
      for (const item of list) {
        if (!item || used.has(item.name)) continue;
        used.add(item.name);
        output.push(item);
        if (output.length >= count) break;
      }
      return output;
    }

    function renderPlan(items) {

        .map(item => ({ ...item, planScore: scoreItem(item, planQuery) }))
        .filter(item => !planQuery || item.planScore > 0 || item.kind === "ingredient" || item.kind === "procedure")
        .sort((a, b) => b.planScore - a.planScore);

      const ingredients = planPool.filter(item => item.kind === "ingredient");
      const procedures = planPool.filter(item => item.kind === "procedure");
      const skinPatterns = getSkinPlanPatterns(state.skin);
      const usedProcedures = new Set();
      const usedIngredients = new Set();
      const rankedProcedures = pattern => scoreRecommendations(procedures, focus, "procedure", pattern).concat(procedures);
      const rankedIngredients = pattern => scoreRecommendations(ingredients, focus, "ingredient", pattern).concat(ingredients);
      const steps = [
        {

          procedures: takeUnique(rankedProcedures(skinPatterns.foundationProcedure), usedProcedures, 4),

        },

          ingredients: takeUnique(rankedIngredients(/ビタミンC|ナイアシン|トラネキサム|アゼライン|サリチル|グリコール|マンデル|コウジ|アルブチン/), usedIngredients, 5)
        },

          procedures: takeUnique(rankedProcedures(skinPatterns.coreProcedure), usedProcedures, 5),
          ingredients: takeUnique(rankedIngredients(mergePattern(skinPatterns.maintenanceIngredient, /レチ|ペプチド|PDRN|PN|エクソソーム|EGF|FGF|ビタミンC|ナイアシン|アゼライン/)), usedIngredients, 5)
        },

          procedures: takeUnique(rankedProcedures(/導入|LED|ケアシス|メソナ|水光|スキンブースター|IPL|光治療/), usedProcedures, 4),
          ingredients: takeUnique(rankedIngredients(mergePattern(skinPatterns.maintenanceIngredient, /酸化亜鉛|酸化チタン|ビタミンC|ナイアシン|トラネキサム|セラミド|ヒアルロン|パンテノール|レチ|ペプチド/)), usedIngredients, 5)
        }
      ];

      const focusText = focus.length ? focus.join(" + ") : "肌質・悩みを選択してください";
      el.planPanel.innerHTML = `
        <details class="plan-accordion" open>

          <div class="plan-steps">
            ${steps.map((step, index) => `

    }

    function renderRecommendRow(label, list, type) {
      const unique = [...new Map(list.filter(Boolean).map(item => [item.name, item])).values()].slice(0, 4);
      if (!unique.length) return "";
      return `
        <div class="recommend-row">
          <div class="recommend-label">${label}</div>
          <div class="recommend-tags">
            ${unique.map(item => `<span class="recommend-tag ${type}">${escapeHtml(item.name)}</span>`).join("")}
          </div>
        </div>
      `;
    }

    function renderCard(item) {
      const query = state.query;
      return `
        <article class="result-card" data-id="${item.id}" role="button" tabindex="0" aria-label="${escapeHtml(item.name)}の詳細を見る">

        </article>
      `;
    }

    function renderMeta(item, query) {
      const rows = [];
      if (item.care) rows.push(["改善策", item.care]);
      if (item.avoid) rows.push(["注意", item.avoid]);
      if (item.fits) rows.push(["相性成分", item.fits.join("、")]);
      if (item.procedures) rows.push(["施術候補", item.procedures]);
      if (item.mechanism) rows.push(["作用機序", item.mechanism]);
      if (item.goodFor) rows.push(["向く悩み", item.goodFor]);
      if (item.features) rows.push(["特徴", item.features]);
      if (item.caution) rows.push(["確認事項", item.caution]);
      return rows.map(([label, value]) => `<li><b>${label}</b><span>${highlight(value, query)}</span></li>`).join("");
    }

    function openDetail(id) {
      const item = data.find(entry => entry.id === id);
      if (!item) return;
      const rows = getDetailRows(item);
      el.detailKind.className = `kind ${item.kind}`;
      el.detailKind.textContent = kindLabels[item.kind];
      el.detailTitle.textContent = item.name;
      el.detailContent.innerHTML = `
        <p class="detail-summary">${highlight(item.summary, state.query)}</p>
        ${rows.map(([label, value]) => `
          <section class="detail-section">
            <h3>${label}</h3>
            <p>${highlight(Array.isArray(value) ? value.join("、") : value, state.query)}</p>
          </section>
        `).join("")}
        <section class="detail-section">
          <h3>関連タグ</h3>
          <div class="tags">
            ${(item.tags || []).map(tag => `<span class="tag">${highlight(tag, state.query)}</span>`).join("")}
          </div>
        </section>
        <section class="detail-section">
          <h3>最新情報を確認</h3>
          ${renderExternalSearch(item.name)}
        </section>
      `;
      el.detailBackdrop.classList.add("open");
      document.body.classList.add("modal-open");
      el.detailClose.focus();
    }

    function closeDetail() {
      el.detailBackdrop.classList.remove("open");
      document.body.classList.remove("modal-open");
    }

    function getDetailRows(item) {
      const rows = [];
      if (item.care) rows.push(["改善策", item.care]);
      if (item.avoid) rows.push(["避けたいこと", item.avoid]);
      if (item.fits) rows.push(["相性の良い成分", item.fits]);
      if (item.procedures) rows.push(["施術候補", item.procedures]);
      if (item.mechanism) rows.push(["効果・作用のメカニズム", item.mechanism]);
      if (item.goodFor) rows.push(["効きやすい肌悩み", item.goodFor]);
      if (item.features) rows.push(["施術内容・特徴", item.features]);
      if (item.caution) rows.push(["確認事項", item.caution]);
      return rows;
    }

    function renderExternalSearch(keyword) {
      const query = encodeURIComponent(`${keyword} 美容皮膚科 効果 適応 副作用 最新`);
      const scholar = encodeURIComponent(`${keyword} dermatology aesthetic treatment mechanism safety`);
      const jpQuery = encodeURIComponent(`${keyword} 公式 美容皮膚科`);
      return `
        <div class="external-search">
          <div class="link-row">
            <a class="link-button" href="https://www.google.com/search?q=${query}" target="_blank" rel="noopener">Googleで検索</a>
            <a class="link-button" href="https://scholar.google.com/scholar?q=${scholar}" target="_blank" rel="noopener">論文を検索</a>
            <a class="link-button" href="https://www.google.com/search?q=${jpQuery}" target="_blank" rel="noopener">公式情報を検索</a>
          </div>
        </div>
      `;
    }

    function normalize(value) {
      return String(value || "").toLowerCase().replace(/[・,、。／/]/g, " ").replace(/\s+/g, " ").trim();
    }

    function highlight(value, query) {
      const text = escapeHtml(String(value || ""));
      if (!query) return text;
      const words = query.split(/\s+/).filter(word => word.length > 0).map(escapeRegExp);
      if (!words.length) return text;
      return text.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>");
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    init();
  </script>
</body>
</html>
