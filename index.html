<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Navigation Ultimate 2026 | Salon Grade</title>
    <style>
        :root {
            /* 最新の美容系ニュアンスカラーパレット */
            --base-white: #FFFFFF;
            --bg-beige: #FDFBF7; /* 柔らかいライトベージュ */
            --primary-accent: #E07A5F; /* 洗練されたテラコッタ（攻め・血色） */
            --secondary-accent: #81B29A; /* 落ち着いたセージグリーン（守り・バリア） */
            --text-dark: #3D405B; /* 深みのあるスレートブルー（テキスト） */
            --text-muted: #8D99AE; /* ダスティブルー（補足テキスト） */
            --border-soft: #F1E3D3; /* ソフトベージュ（枠線） */
            --glass-bg: rgba(255, 255, 255, 0.7); /* グラスモルフィズム用 */
        }

        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background-color: var(--bg-beige);
            color: var(--text-dark);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 60px 20px;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: var(--primary-accent);
            margin-bottom: 5px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 50px;
            letter-spacing: 0.02em;
        }

        /* 2026年デザイン：グラスモルフィズムと柔らかいシャドウ */
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 8px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 4px 15px rgba(224, 122, 95, 0.05);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .tab-btn {
            padding: 12px 25px;
            font-size: 0.95rem;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 50px;
            margin: 0 5px;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--primary-accent);
            background: rgba(224, 122, 95, 0.05);
        }

        .tab-btn.active {
            color: var(--base-white);
            background: linear-gradient(135deg, var(--primary-accent), #f19f86);
            box-shadow: 0 4px 15px rgba(224, 122, 95, 0.3);
        }

        /* 検索セクション：強調と洗練 */
        .search-section {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .search-section label {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 15px;
            display: block;
        }

        .search-box {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        input[type="text"] {
            flex: 0 1 70%;
            padding: 15px 20px;
            border: 1px solid var(--border-soft);
            border-radius: 50px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: all 0.3s;
            color: var(--text-dark);
        }

        input[type="text"]:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.1);
        }

        button.search-trigger {
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary-accent), #f19f86);
            color: var(--base-white);
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(224, 122, 95, 0.2);
            white-space: nowrap;
        }

        button.search-trigger:hover {
            box-shadow: 0 6px 20px rgba(224, 122, 95, 0.3);
            transform: translateY(-1px);
        }

        .keywords-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 2.2;
        }

        .keywords-hint strong {
            color: var(--text-dark);
            margin-right: 5px;
        }

        .keyword-tag {
            display: inline-block;
            background: #F8EDEA; /* 柔らかいモーヴピンク */
            color: #C9ADA7; /* ダスティピンク */
            padding: 6px 14px;
            border-radius: 50px;
            margin: 0 4px;
            cursor: pointer;
            font-size: 0.8rem;
            border: 1px solid #F1E3D3;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .keyword-tag:hover {
            background: var(--border-soft);
            color: var(--primary-accent);
        }

        /* 結果表示エリア：柔らかい高級感 */
        .result-card {
            background: var(--base-white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
            display: none;
            animation: fadeIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid #F0F0F0;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .result-header h2 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--primary-accent);
            font-weight: bold;
        }

        .skin-description {
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.05), rgba(243, 156, 18, 0.01));
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            color: var(--text-dark);
            font-size: 0.95rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.01);
        }

        .skin-description strong {
            color: #E07A5F; 
        }

        .section-title {
            font-size: 1.15rem;
            color: var(--primary-accent);
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--primary-accent);
        }

        .section-title.守り {
            color: var(--secondary-accent);
        }
        .section-title.守り::before {
             background-color: var(--secondary-accent);
        }

        /* 詳細アイテム：角丸カード */
        .detail-item {
            background: var(--bg-beige);
            border: 1px solid var(--border-soft);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.01);
            transition: all 0.3s;
        }
        
        .detail-item:hover {
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.02);
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        /* アイコン：CSSでのSVG描画 */
        .item-name::before {
            content: '';
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            margin-right: 10px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        /* 成分（分子アイコン） */
        .item-name.ingredient-icon::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23E07A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="19" r="4"></circle><circle cx="17" cy="5" r="4"></circle><path d="M7 15l10-10"></path></svg>');
        }

        /* 施術（スパークルアイコン） */
        .item-name.treatment-icon::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%2381B29A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"></path></svg>');
        }

        .detail-section {
            margin-bottom: 12px;
        }

        .detail-section-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: 3px;
        }

        .detail-text {
            font-size: 0.9rem;
            color: var(--text-dark);
            margin: 0;
            padding-left: 12px;
            border-left: 2px solid rgba(224, 122, 95, 0.2);
        }

        .treatment-text {
            border-left: 2px solid rgba(129, 178, 154, 0.4);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Beauty Navigation</h1>
    <div class="subtitle">Ultimate 2026 | Salon Grade Analysis</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('skintype')">① 肌質別ケア</button>
        <button class="tab-btn" onclick="switchTab('concern')">② お悩み検索</button>
        <button class="tab-btn" onclick="switchTab('ingredient')">③ 美容成分辞書</button>
    </div>

    <div id="skintype-section" class="tab-content">
        <div class="search-section">
            <label>ご自身の「肌質」を選択、または入力してください</label>
            <div class="search-box">
                <input type="text" id="skintype-input" placeholder="例：普通肌、乾燥肌、脂性肌、混合肌、敏感肌">
                <button class="search-trigger" onclick="searchBySkinType()">診断する</button>
            </div>
            <div class="keywords-hint">
                <span class="keyword-tag" onclick="setKeyword('skintype', '普通肌')">普通肌</span>
                <span class="keyword-tag" onclick="setKeyword('skintype', '乾燥肌')">乾燥肌</span>
                <span class="keyword-tag" onclick="setKeyword('skintype', '脂性肌')">脂性肌（オイリー）</span>
                <span class="keyword-tag" onclick="setKeyword('skintype', '混合肌')">混合肌（インナードライ）</span>
                <span class="keyword-tag" onclick="setKeyword('skintype', '敏感肌')">敏感肌</span>
            </div>
        </div>
        <div id="skintype-result" class="result-card"></div>
    </div>

    <div id="concern-section" class="tab-content hidden">
        <div class="search-section">
            <label>気になるお悩み、キーワードを入力してください</label>
            <div class="search-box">
                <input type="text" id="concern-input" placeholder="例：クレーター、たるみ、肝斑、インナードライ">
                <button class="search-trigger" onclick="searchByConcern()">解決策を探す</button>
            </div>
            <div class="keywords-hint">
                <span class="keyword-tag" onclick="setKeyword('concern', 'クレーター')">クレーター</span>
                <span class="keyword-tag" onclick="setKeyword('concern', 'たるみ')">たるみ・ほうれい線</span>
                <span class="keyword-tag" onclick="setKeyword('concern', 'くすみ')">くすみ・肝斑</span>
                <span class="keyword-tag" onclick="setKeyword('concern', '毛穴の開き')">毛穴の開き</span>
            </div>
        </div>
        <div id="concern-result" class="result-card"></div>
    </div>

    <div id="ingredient-section" class="tab-content hidden">
        <div class="search-section">
            <label>調べたい「美容成分」を入力してください</label>
            <div class="search-box">
                <input type="text" id="ingredient-input" placeholder="例：エクソソーム、バクチオール、NMN、セラミド">
                <button class="search-trigger" onclick="searchByIngredient()">成分を調べる</button>
            </div>
            <div class="keywords-hint">
                <strong>【次世代成分】</strong>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'エクソソーム')">エクソソーム</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'PDRN')">PDRN</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'バクチオール')">バクチオール</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'NMN')">NMN</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'グルタチオン')">グルタチオン</span>
                <br><strong>【定番・有効成分】</strong>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'ビタミンC')">ビタミンC</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'レチノール')">レチノール</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'ライスパワー')">ライスパワー</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'ナイアシンアミド')">ナイアシンアミド</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'セラミド')">セラミド</span>
            </div>
        </div>
        <div id="ingredient-result" class="result-card"></div>
    </div>
</div>

<script>
    // ==========================================
    // ① 肌質別マスターデータベース（完全版）
    // ==========================================
    const skinTypeData = [
        {
            keywords: ["普通肌", "ノーマル"],
            title: "普通肌（Normal Skin）",
            description: "水分と油分のバランスが理想的で、トラブルが起きにくい肌質です。キメが整っており、バリア機能も正常に働いています。現状維持と「未来の老化予防（攻めと守り）」を両立するケアが重要です。",
            ingredients: [
                {
                    name: "フラーレン",
                    effect: "ビタミンCの数百倍とも言われる強力な抗酸化力で、紫外線やストレスによる活性酸素を長時間にわたって無害化し、肌の酸化（老化）を未然に防ぎます。",
                    reason: "トラブルのない普通肌が最も注力すべきは「光老化の予防」です。フラーレンはスポンジのように活性酸素を吸着し続けるため、日中の肌ダメージをゼロに近づける最強の守りとなります。"
                },
                {
                    name: "ビタミンC誘導体 ＋ ナイアシンアミド",
                    effect: "コラーゲンの生成をサポートしつつ、メラニンの蓄積を防ぎ、肌の透明感とハリを維持します。",
                    reason: "普通肌は攻めの成分にも耐えやすいため、シミとシワを同時に予防できるこの2つの成分を日常的に取り入れることで、数年後の肌状態に圧倒的な差がつきます。"
                }
            ],
            treatments: [
                {
                    name: "光治療（IPL / Stellar M22など）",
                    content: "複数の波長の光を顔全体にマイルドに照射し、潜在的なシミや赤み、コラーゲン低下を総合的にメンテナンスする治療です。",
                    reason: "大きな悩みがない状態でも、定期的なIPL照射によって肌全体のトーンを均一に保ち、ターンオーバーを正常化させる「肌の定期検診・クリーニング」として最適だからです。"
                }
            ]
        },
        {
            keywords: ["乾燥肌", "ドライ"],
            title: "乾燥肌（Dry Skin）",
            description: "皮脂の分泌量が少なく、角質層の水分量も不足している状態。バリア機能が低下しやすく、洗顔後のつっぱり感や、ちりめんジワ、粉吹きが起きやすいのが特徴です。",
            ingredients: [
                {
                    name: "ヒト型セラミド ＋ ライスパワー®No.11+",
                    effect: "セラミドで細胞間の隙間を埋めて水分の蒸発を即座に防ぎ、ライスパワーで肌自らがセラミドを作り出す能力（水分保持能）を根本から改善します。No.11+はシワ改善効果も持ちます。",
                    reason: "乾燥肌は「自前で潤いを保つ力」が欠如しています。ヒアルロン酸などで外から濡らすだけでなく、バリアの主成分であるセラミドを補い・作らせるという根本治療が必要不可欠だからです。"
                },
                {
                    name: "D-パントテニルアルコール（パンテノール）",
                    effect: "肌の修復ビタミンと呼ばれ、荒れた角質層のバリア機能を修復し、保水力を高めます。刺激を和らげる効果に優れます。",
                    reason: "乾燥して微細な炎症（ヒリヒリ感）が起きている肌を優しく鎮静しながら潤すため、攻めの成分を使う前の土台作りに最適だからです。"
                }
            ],
            treatments: [
                {
                    name: "非架橋ヒアルロン酸の水光注射 / エクソソーム導入",
                    content: "極細の針で真皮層へ直接、水分を抱え込むヒアルロン酸や修復成分（エクソソーム）を均等に注入・導入します。",
                    reason: "化粧水が届かない真皮層の水分枯渇を物理的に解決し、細胞レベルから乾燥しにくい分厚い肌へと作り変えることができるためです。"
                }
            ]
        },
        {
            keywords: ["脂性肌", "オイリー", "テカリ"],
            title: "脂性肌（Oily Skin）",
            description: "皮脂腺の働きが活発で、顔全体にテカリやベタつきが出やすい肌質。毛穴の開きや黒ずみ、ニキビといったトラブルが発生しやすい状態です。",
            ingredients: [
                {
                    name: "アゼライン酸 ＋ ビタミンC",
                    effect: "皮脂の分泌を強力にコントロールし、アクネ菌の増殖を抑え、毛穴の開きや皮脂の酸化による黒ずみを防ぎます。",
                    reason: "皮脂を「取る」のではなく「出させない・酸化させない」アプローチが必須です。アゼライン酸は皮脂抑制と抗菌に優れ、ビタミンCは皮脂の酸化ダメージを防ぐため相性抜群です。"
                },
                {
                    name: "サリチル酸（BHA） / ティーツリー",
                    effect: "脂溶性のBHAが毛穴の奥の皮脂詰まりを溶かし、ティーツリーが天然の殺菌作用でニキビの炎症を防ぎます。",
                    reason: "水溶性の成分では皮脂に弾かれてしまうため、油分に溶け込むサリチル酸で毛穴内部の角栓を大掃除することが脂性肌のトラブル予防の第一歩だからです。"
                }
            ],
            treatments: [
                {
                    name: "ハイドラフェイシャル ＋ スキンボトックス",
                    content: "水流ピーリングで毛穴の奥の皮脂を洗浄した後、皮膚の浅い層にボトックスを細かく打ち、皮脂腺の働きをマイルドに麻痺させます。",
                    reason: "皮脂の詰まりを物理的にリセットし、スキンボトックスで「皮脂を出す蛇口を締める」ことで、数ヶ月間にわたりテカリや毛穴の開きを劇的に抑え込めるからです。"
                }
            ]
        },
        {
            keywords: ["混合肌", "インナードライ", "コンビネーション"],
            title: "混合肌・インナードライ（Combination Skin）",
            description: "Tゾーン（おでこ・鼻）は皮脂でテカるのに、Uゾーン（頬・口周り）は乾燥してつっぱる、日本人に最も多い肌質。内部の乾燥を補うために過剰な皮脂が出ている状態です。",
            ingredients: [
                {
                    name: "ガラクトミセス培養液 ＋ アミノ酸（NMF）",
                    effect: "酵母発酵エキス（ガラクトミセス）が皮脂バランスを整えながら透明感を引き出し、アミノ酸が肌本来の天然保湿因子を補填してキメを均一に揃えます。",
                    reason: "部位によって状態が違うため、皮脂を奪いすぎず、かつ水分をしっかり与える「調整力」の高い発酵成分と、肌に親和性の高いアミノ酸が全体の底上げに最適だからです。"
                },
                {
                    name: "ナイアシンアミド",
                    effect: "セラミドの合成を促してUゾーンの乾燥（バリア機能低下）を改善しつつ、Tゾーンの皮脂分泌もマイルドに抑える効果を持ちます。",
                    reason: "一つの成分で「保湿」と「皮脂抑制」という相反する混合肌の悩みを同時にカバーできる、極めて優秀なバランサー成分だからです。"
                }
            ],
            treatments: [

                        <p class="detail-text treatment-text">${trt.reason}</p>
                    </div>
                </div>
            `).join('');

            resultDiv.innerHTML = `
                <div class="result-header">
                    <h2>【肌質診断】${matchedData.title}</h2>
                </div>
                <div class="skin-description">
                    💡 <strong>特徴とケア方針：</strong><br>${matchedData.description}
                </div>
                <div class="section-title">✨ 推奨する美容成分</div>
                ${ingredientsHtml}
                <div class="section-title 守り">🏥 おすすめの美容医療</div>
                ${treatmentsHtml}
            `;
        } else {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<p style="color:var(--accent-color); font-weight:bold; text-align:center;">該当する肌質が見つかりません。「普通肌」「乾燥肌」「脂性肌」「混合肌」「敏感肌」からお試しください。</p>`;
        }
    }

    function searchByConcern() {
        const input = document.getElementById('concern-input').value.trim().toLowerCase();
        const resultDiv = document.getElementById('concern-result');
        if (!input) return alert('キーワードを入力してください。');
        
        let matchedItems = concernDataMaster.filter(item => 
            item.keywords.some(kw => input.includes(kw.toLowerCase()) || kw.toLowerCase().includes(input))
        );
        
        if (matchedItems.length > 0) {
            resultDiv.style.display = 'block';
            let htmlContent = "";

            matchedItems.forEach(matchedData => {
                const ingredientsHtml = matchedData.ingredients.map(ing => `
                    <div class="detail-item">
                        <div class="item-name ingredient-icon">${ing.name}</div>
                        <div class="detail-section">
                            <div class="detail-section-title">主要効果とメカニズム</div>
                            <p class="detail-text">${ing.effect}</p>
                        </div>
                        <div class="detail-section" style="margin-top:15px;">
                            <div class="detail-section-title">改善の理由</div>
                            <p class="detail-text">${ing.reason}</p>
                        </div>
                    </div>
                `).join('');

                const treatmentsHtml = matchedData.treatments.map(trt => `
                    <div class="detail-item">
                        <div class="item-name treatment-icon">${trt.name}</div>
                        <div class="detail-section">
                            <div class="detail-section-title">施術内容</div>
                            <p class="detail-text treatment-text">${trt.content}</p>
                        </div>
                        <div class="detail-section" style="margin-top:15px;">
                            <div class="detail-section-title">解決できる理由</div>
                            <p class="detail-text treatment-text">${trt.reason}</p>
                        </div>
                    </div>
                `).join('');

                htmlContent += `
                    <div style="margin-bottom: 50px;">
                        <div class="result-header">
                            <h2>【解決案】${matchedData.title}</h2>
                        </div>
                        <div class="section-title">✨ 推奨する美容成分</div>
                        ${ingredientsHtml}
                        <div class="section-title 守り">🏥 最新の美容医療アプローチ</div>
                        ${treatmentsHtml}
                    </div>
                `;
            });
            resultDiv.innerHTML = htmlContent;
        } else {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<p style="color:var(--accent-color); font-weight:bold; text-align:center;">該当するデータがありません。「クレーター」「たるみ」などを入力してください。</p>`;
        }
    }

    function searchByIngredient() {
        const input = document.getElementById('ingredient-input').value.trim().toLowerCase();
        const resultDiv = document.getElementById('ingredient-result');
        if (!input) return alert('成分名を入力してください。');
        
        let matchedData = null;
        for (let key in ingredientDatabase) { 
            if (input.includes(key) || key.includes(input)) { 
                matchedData = ingredientDatabase[key]; 
                break; 
            } 
        }
        
        if (matchedData) {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="result-header">
                    <h2>【成分名】${matchedData.name}</h2>
                    <p style="color: var(--text-muted); font-weight: bold; margin-top:5px;">${matchedData.summary}</p>
                </div>
                <div class="section-title">📋 主な効果・効能</div>
                <div class="detail-item">
                    <p class="detail-text" style="border:none; padding:0;">${matchedData.mainEffects}</p>
                </div>
                <div class="section-title 守り">🔬 作用メカニズム</div>
                <div class="detail-item">
                    <p class="detail-text treatment-text" style="border:none; padding:0;">${matchedData.mechanism}</p>
                </div>
            `;
        } else { 
            resultDiv.style.display = 'block'; 
            resultDiv.innerHTML = `<p style="color:var(--accent-color); font-weight:bold; text-align:center;">成分が見つかりません。「エクソソーム」「PDRN」などをお試しください。</p>`; 
        }
    }

    function switchTab(tabName) { 
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); 
        document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden')); 
        
        if (tabName === 'skintype') { 
            document.querySelector('.tabs .tab-btn:nth-child(1)').classList.add('active'); 
            document.getElementById('skintype-section').classList.remove('hidden'); 
        } else if (tabName === 'concern') { 
            document.querySelector('.tabs .tab-btn:nth-child(2)').classList.add('active'); 
            document.getElementById('concern-section').classList.remove('hidden'); 
        } else { 
            document.querySelector('.tabs .tab-btn:nth-child(3)').classList.add('active'); 
            document.getElementById('ingredient-section').classList.remove('hidden'); 
        } 
    }

    function setKeyword(type, word) { 
        document.getElementById(type + '-input').value = word; 
        if (type === 'skintype') searchBySkinType(); 
        else if (type === 'concern') searchByConcern(); 
        else searchByIngredient(); 
    }
</script>
</body>
</html>
