<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Navigation Ultimate 2026 | Salon Grade</title>
    <style>
        :root {
            /* 最新の美容系ニュアンスカラーパレット */
            --base-white: #FFFFFF;
            --bg-beige: #FDFBF7; /* 柔らかいライトベージュ */
            --primary-accent: #E07A5F; /* 洗練されたテラコッタ（攻め・血色） */
            --secondary-accent: #81B29A; /* 落ち着いたセージグリーン（守り・バリア） */
            --tertiary-accent: #F2CC8F; /* 温かみのあるゴールドベージュ（施術・光） */
            --text-dark: #3D405B; /* 深みのあるスレートブルー（テキスト） */
            --text-muted: #8D99AE; /* ダスティブルー（補足テキスト） */
            --border-soft: #F1E3D3; /* ソフトベージュ（枠線） */
            --glass-bg: rgba(255, 255, 255, 0.85); /* グラスモルフィズム用 */
        }

        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background-color: var(--bg-beige);
            color: var(--text-dark);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 950px;
            width: 100%;
            margin: 40px 15px;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: var(--primary-accent);
            margin-bottom: 5px;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
            letter-spacing: 0.02em;
        }

        /* 2026年デザイン：グラスモルフィズムと柔らかいシャドウ */
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 8px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 4px 20px rgba(61, 64, 91, 0.05);
            position: sticky;
            top: 15px;
            z-index: 100;
            gap: 5px;
        }

        .tab-btn {
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 12px;
            white-space: nowrap;
            flex: 1 1 auto;
            text-align: center;
        }

        .tab-btn:hover {
            color: var(--primary-accent);
            background: rgba(224, 122, 95, 0.05);
        }

        .tab-btn.active {
            color: var(--base-white);
            background: linear-gradient(135deg, var(--primary-accent), #f19f86);
            box-shadow: 0 4px 15px rgba(224, 122, 95, 0.3);
        }

        /* 検索セクション：強調と洗練 */
        .search-section {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .search-section label {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 15px;
            display: block;
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1 1 250px;
            padding: 14px 20px;
            border: 2px solid var(--border-soft);
            border-radius: 12px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: all 0.3s;
            color: var(--text-dark);
        }

        input[type="text"]:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.1);
        }

        button.search-trigger {
            padding: 14px 25px;
            background: var(--text-dark);
            color: var(--base-white);
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(61, 64, 91, 0.2);
            white-space: nowrap;
        }

        button.search-trigger:hover {
            background: #2a2c40;
            transform: translateY(-2px);
        }

        .keywords-hint {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 2.2;
        }

        .keywords-hint strong {
            color: var(--text-dark);
            margin-right: 5px;
            font-size: 0.85rem;
        }

        .keyword-tag {
            display: inline-block;
            background: #F8EDEA; 
            color: #C9ADA7;
            padding: 4px 12px;
            border-radius: 50px;
            margin: 2px 4px;
            cursor: pointer;
            font-size: 0.75rem;
            border: 1px solid #F1E3D3;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .keyword-tag:hover {
            background: var(--border-soft);
            color: var(--primary-accent);
        }

        /* 結果表示エリア：柔らかい高級感 */
        .result-card {
            background: var(--base-white);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid #F0F0F0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .result-header h2 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary-accent);
            font-weight: bold;
        }

        .skin-description, .treatment-category-badge {
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.05), rgba(243, 156, 18, 0.01));
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            color: var(--text-dark);
            font-size: 0.9rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.01);
        }

        .treatment-category-badge {
            background: rgba(129, 178, 154, 0.1);
            color: var(--secondary-accent);
            font-weight: bold;
            display: inline-block;
            padding: 6px 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--primary-accent);
            margin-top: 35px;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--primary-accent);
        }

        .section-title.守り { color: var(--secondary-accent); }
        .section-title.守り::before { background-color: var(--secondary-accent); }

        /* 詳細アイテム：角丸カード */
        .detail-item {
            background: var(--bg-beige);
            border: 1px solid var(--border-soft);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.01);
            transition: all 0.3s;
        }
        
        .detail-item:hover {
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.02);
            background: #fffcf9;
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .item-name::before {
            content: '';
            display: inline-block;
            width: 1.1rem;
            height: 1.1rem;
            margin-right: 8px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        .item-name.ingredient-icon::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23E07A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="19" r="4"></circle><circle cx="17" cy="5" r="4"></circle><path d="M7 15l10-10"></path></svg>');
        }

        .item-name.treatment-icon::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%2381B29A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"></path></svg>');
        }

        .detail-section {
            margin-bottom: 10px;
        }

        .detail-section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: 3px;
        }

        .detail-text {
            font-size: 0.9rem;
            color: var(--text-dark);
            margin: 0;
            padding-left: 10px;
            border-left: 2px solid rgba(224, 122, 95, 0.2);
        }

        .treatment-text {
            border-left: 2px solid rgba(129, 178, 154, 0.4);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Beauty Navigation</h1>
    <div class="subtitle">Ultimate 2026 | Salon Grade Analysis</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('skintype')">① 肌質別診断</button>
        <button class="tab-btn" onclick="switchTab('concern')">② お悩み別解決策</button>
        <button class="tab-btn" onclick="switchTab('ingredient')">③ 美容成分辞典</button>
        <button class="tab-btn" onclick="switchTab('treatment')">④ 最新施術カタログ</button>
    </div>

    <div id="skintype-section" class="tab-content">
        <div class="search-section">
            <label>ご自身の「肌質」を選択、または入力してください</label>
            <div class="search-box">
                <input type="text" id="skintype-input" placeholder="例：普通肌、乾燥肌、脂性肌、混合肌、敏感肌">
                <button class="search-trigger" onclick="searchBySkinType()">診断する</button>
            </div>
            <div class="keywords-hint">
                <span class="keyword-tag" onclick="setKeyword('skintype', '普通肌')">普通肌</span>
                <span class="keyword-tag" onclick="setKeyword('skintype', '乾燥肌')">乾燥肌</span>
                <span class="keyword-tag" onclick="setKeyword('skintype', '脂性肌')">脂性肌（オイリー）</span>
                <span class="keyword-tag" onclick="setKeyword('skintype', '混合肌')">混合肌（インナードライ）</span>
                <span class="keyword-tag" onclick="setKeyword('skintype', '敏感肌')">敏感肌</span>
            </div>
        </div>
        <div id="skintype-result" class="result-card"></div>
    </div>

    <div id="concern-section" class="tab-content hidden">
        <div class="search-section">
            <label>気になるお悩み、キーワードを入力してください</label>
            <div class="search-box">
                <input type="text" id="concern-input" placeholder="例：クレーター、たるみ、肝斑、インナードライ">
                <button class="search-trigger" onclick="searchByConcern()">解決策を探す</button>
            </div>
            <div class="keywords-hint">
                <span class="keyword-tag" onclick="setKeyword('concern', 'クレーター')">クレーター</span>
                <span class="keyword-tag" onclick="setKeyword('concern', 'たるみ')">たるみ・ほうれい線</span>
                <span class="keyword-tag" onclick="setKeyword('concern', 'くすみ')">くすみ・肝斑</span>
                <span class="keyword-tag" onclick="setKeyword('concern', '毛穴の開き')">毛穴の開き</span>
            </div>
        </div>
        <div id="concern-result" class="result-card"></div>
    </div>

    <div id="ingredient-section" class="tab-content hidden">
        <div class="search-section">
            <label>調べたい「美容成分」を入力してください</label>
            <div class="search-box">
                <input type="text" id="ingredient-input" placeholder="例：エクソソーム、バクチオール、NMN、セラミド">
                <button class="search-trigger" onclick="searchByIngredient()">成分を調べる</button>
            </div>
            <div class="keywords-hint">
                <strong>【次世代】</strong>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'エクソソーム')">エクソソーム</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'PDRN')">PDRN</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'バクチオール')">バクチオール</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'NMN')">NMN</span>
                <br><strong>【定番】</strong>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'ビタミンC')">ビタミンC</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'レチノール')">レチノール</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'ナイアシンアミド')">ナイアシンアミド</span>
                <span class="keyword-tag" onclick="setKeyword('ingredient', 'セラミド')">セラミド</span>
            </div>
        </div>
        <div id="ingredient-result" class="result-card"></div>
    </div>

    <div id="treatment-section" class="tab-content hidden">
        <div class="search-section">
            <label>調べたい「美容施術・医療機器」や「悩み」を入力してください</label>
            <div class="search-box">
                <input type="text" id="treatment-input" placeholder="例：ジュベルック、ポテンツァ、二重埋没、ハイフ">
                <button class="search-trigger" onclick="searchByTreatment()">施術を探す</button>
            </div>
            <div class="keywords-hint">
                <strong>【最新トレンド】</strong>
                <span class="keyword-tag" onclick="setKeyword('treatment', 'ジュベルック')">ジュベルック</span>
                <span class="keyword-tag" onclick="setKeyword('treatment', 'ポテンツァ')">ポテンツァ</span>
                <span class="keyword-tag" onclick="setKeyword('treatment', 'プロファイロ')">プロファイロ</span>
                <span class="keyword-tag" onclick="setKeyword('treatment', 'ララピール')">ララピール</span>
                <br><strong>【定番施術】</strong>
                <span class="keyword-tag" onclick="setKeyword('treatment', 'ハイフ')">ハイフ (HIFU)</span>
                <span class="keyword-tag" onclick="setKeyword('treatment', 'ピコトーニング')">ピコトーニング</span>
                <span class="keyword-tag" onclick="setKeyword('treatment', 'ダーマペン')">ダーマペン4</span>
                <span class="keyword-tag" onclick="setKeyword('treatment', 'ボトックス')">ボトックス</span>
            </div>
        </div>
        <div id="treatment-result" class="result-card"></div>
    </div>
</div>

<script>
    // ==========================================
    // ① 肌質別マスターデータベース
    // ==========================================
    const skinTypeData = [
        {
            keywords: ["普通肌", "ノーマル"],
            title: "普通肌（Normal Skin）",
            description: "水分と油分のバランスが理想的で、トラブルが起きにくい肌質です。現状維持と「未来の老化予防（攻めと守り）」を両立するケアが重要です。",
            ingredients: [
                { name: "フラーレン", effect: "ビタミンCの数百倍とも言われる強力な抗酸化力で、活性酸素を長時間無害化します。", reason: "光老化の予防に特化し、日中のダメージを最小限に抑える最強の守りとなります。" },
                { name: "ビタミンC誘導体 ＋ ナイアシンアミド", effect: "コラーゲン生成をサポートし、メラニン蓄積を防ぎます。", reason: "シミ・シワを同時に予防し、数年後の肌状態に圧倒的な差をつけるためです。" }
            ],
            treatments: [
                { name: "光治療（IPL / Stellar M22など）", content: "複数の波長の光をマイルドに照射し、潜在的なシミや赤みを総合的にメンテナンスします。", reason: "ターンオーバーを正常化させる「肌の定期検診」として最適だからです。" }
            ]
        },
        {
            keywords: ["乾燥肌", "ドライ"],
            title: "乾燥肌（Dry Skin）",
            description: "皮脂分泌が少なく水分量も不足している状態。バリア機能が低下しやすく、ちりめんジワが起きやすいのが特徴です。",
            ingredients: [
                { name: "ヒト型セラミド ＋ ライスパワー®No.11+", effect: "細胞間の隙間を埋めて水分蒸発を防ぎ、自らのセラミド生成能を根本改善します。", reason: "外から濡らすだけでなく、バリア主成分を補い・作らせる根本治療が必要だからです。" },
                { name: "D-パントテニルアルコール", effect: "荒れた角質層を修復し、刺激を和らげます。", reason: "微細な炎症を優しく鎮静し、攻め成分を使う前の土台作りに最適だからです。" }
            ],
            treatments: [
                { name: "非架橋ヒアルロン酸の水光注射 / エクソソーム導入", content: "極細の針や電気で真皮層へ直接水分と修復成分を注入・導入します。", reason: "化粧水が届かない真皮層の水分枯渇を物理的に解決し、分厚い肌へ作り変えるためです。" }
            ]
        },
        {
            keywords: ["脂性肌", "オイリー", "テカリ"],
            title: "脂性肌（Oily Skin）",
            description: "皮脂腺が活発でテカリが出やすい肌質。毛穴の開きや黒ずみ、ニキビが発生しやすい状態です。",
            ingredients: [
                { name: "アゼライン酸 ＋ ビタミンC", effect: "皮脂分泌を強力にコントロールし、酸化による黒ずみを防ぎます。", reason: "皮脂を「取る」のではなく「出させない・酸化させない」アプローチが必須だからです。" },
                { name: "サリチル酸（BHA） / ティーツリー", effect: "毛穴の奥の皮脂詰まりを溶かし、天然の殺菌作用でニキビを防ぎます。", reason: "水溶性成分では弾かれるため、油分に溶け込む成分で毛穴内部を掃除する必要があるためです。" }
            ],
            treatments: [
                { name: "ハイドラフェイシャル ＋ スキンボトックス", content: "水流ピーリング後、皮膚浅層にボトックスを打ち皮脂腺をマイルドに麻痺させます。", reason: "物理的リセットと「皮脂の蛇口を締める」ことで、長期間テカリを劇的に抑え込めるからです。" }
            ]
        },
        {
            keywords: ["混合肌", "インナードライ", "コンビネーション"],
            title: "混合肌・インナードライ（Combination Skin）",
            description: "TゾーンはテカるのにUゾーンは乾燥する肌質。内部の乾燥を補うために過剰な皮脂が出ています。",

            ]
        },
        {
            keywords: ["敏感肌", "ゆらぎ肌", "センシティブ"],
            title: "敏感肌（Sensitive Skin）",
            description: "バリア機能が低下し、外部刺激に過敏に反応してしまう状態。赤み、ヒリヒリ感が頻発します。",
            ingredients: [
                { name: "GABOB", effect: "神経伝達系にアプローチし、刺激に対する過剰反応を能動的に鎮めます。", reason: "「過剰な炎症シグナル」そのものをブロックする新世代のケアが必要だからです。" },
                { name: "CICA ＋ グリチルリチン酸2K", effect: "傷ついた組織を修復し、強力な消炎作用で赤みや肌荒れを急速に鎮静します。", reason: "慢性的な微細炎症の「火事」を素早く消し止めることが最優先だからです。" }

    function switchTab(tabName) { 
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); 
        document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden')); 
        
        if (tabName === 'skintype') { 
            document.querySelector('.tabs .tab-btn:nth-child(1)').classList.add('active'); 
            document.getElementById('skintype-section').classList.remove('hidden'); 
        } else if (tabName === 'concern') { 
            document.querySelector('.tabs .tab-btn:nth-child(2)').classList.add('active'); 
            document.getElementById('concern-section').classList.remove('hidden'); 
        } else if (tabName === 'ingredient') { 
            document.querySelector('.tabs .tab-btn:nth-child(3)').classList.add('active'); 
            document.getElementById('ingredient-section').classList.remove('hidden'); 
        } else {
            document.querySelector('.tabs .tab-btn:nth-child(4)').classList.add('active'); 
            document.getElementById('treatment-section').classList.remove('hidden'); 
        }
    }

    function setKeyword(type, word) { 
        document.getElementById(type + '-input').value = word; 
        if (type === 'skintype') searchBySkinType(); 
        else if (type === 'concern') searchByConcern(); 
        else if (type === 'ingredient') searchByIngredient(); 
        else searchByTreatment();
    }
</script>
</body>
